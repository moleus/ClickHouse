name: TimeSeries adaptive grid dense native PromQL matched ABA

on:
  push:
    branches: [lab/timeseries-fastpath-ci]
    paths:
      - '.github/workflows/ts-lab-dense-adaptive-aba.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: tslab-dense-adaptive-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  sql_bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        series: [5000, 50000]
    env:
      GH_TOKEN: ${{ github.token }}
      SERIES: ${{ matrix.series }}
      REPO: moleus/ClickHouse
      CH_RUN: '41301314345'
      VM_RUN: '41288854734'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact ANTL enabled baseline and VM binaries
        run: |
          set -euo pipefail
          mkdir -p evidence "$RUNNER_TEMP/ch-art" "$RUNNER_TEMP/ch-bin" "$RUNNER_TEMP/vm-art" "$RUNNER_TEMP/vm-bin"
          gh run download "$CH_RUN" -R "$REPO" --pattern 'tslab-clickhouse-amd64-*' \
            -D "$RUNNER_TEMP/ch-art"
          ch_archive="$(find "$RUNNER_TEMP/ch-art" -type f -name 'clickhouse-linux-amd64.tar.zst' -print -quit)"
          test -s "$ch_archive"
          (cd "$(dirname "$ch_archive")" && sha256sum -c ARCHIVE_SHA256SUMS) | tee evidence/ch-archive-checksum.txt
          zstd -dc "$ch_archive" | tar -xf - -C "$RUNNER_TEMP/ch-bin"
          (cd "$RUNNER_TEMP/ch-bin" && sha256sum -c SHA256SUMS) | tee evidence/ch-binary-checksum.txt
          chmod +x "$RUNNER_TEMP/ch-bin/clickhouse"
          "$RUNNER_TEMP/ch-bin/clickhouse" --version | tee evidence/ch-version.txt
          gh run download "$VM_RUN" -R "$REPO" -n tslab-victoria-metrics-v1.134.0 -D "$RUNNER_TEMP/vm-art"
          (cd "$RUNNER_TEMP/vm-art" && sed 's#  output/#  #' SHA256SUMS | sha256sum -c -) | tee evidence/vm-archive-checksum.txt
          tar -xzf "$RUNNER_TEMP/vm-art/victoria-metrics-linux-amd64-v1.134.0.tar.gz" -C "$RUNNER_TEMP/vm-bin"
          chmod +x "$RUNNER_TEMP/vm-bin/victoria-metrics-prod"
          "$RUNNER_TEMP/vm-bin/victoria-metrics-prod" --version 2>&1 | head -n 3 | tee evidence/vm-version.txt
      - name: Start isolated query engines
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ch/data" "$RUNNER_TEMP/ch/tmp" "$RUNNER_TEMP/ch/userfiles" "$RUNNER_TEMP/vm/data"
          cat > "$RUNNER_TEMP/config.xml" <<EOF
          <clickhouse>
            <logger><level>warning</level><console>true</console></logger>
            <listen_host>127.0.0.1</listen_host><http_port>18191</http_port><tcp_port>19000</tcp_port>
            <path>$RUNNER_TEMP/ch/data/</path><tmp_path>$RUNNER_TEMP/ch/tmp/</tmp_path>
            <user_files_path>$RUNNER_TEMP/ch/userfiles/</user_files_path>
            <users><default><password></password><networks><ip>127.0.0.1</ip></networks><profile>default</profile><quota>default</quota></default></users>
            <profiles><default><allow_experimental_time_series_table>1</allow_experimental_time_series_table><max_memory_usage>1200000000</max_memory_usage><enable_time_series_aggregate_functions>1</enable_time_series_aggregate_functions><log_queries>1</log_queries></default></profiles>
            <query_log><database>system</database><table>query_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></query_log>
          <quotas><default><interval><duration>3600</duration></interval></default></quotas>
            <default_profile>default</default_profile><default_database>default</default_database>
          </clickhouse>
          EOF
          "$RUNNER_TEMP/ch-bin/clickhouse" server --config-file="$RUNNER_TEMP/config.xml" > evidence/ch-server.log 2>&1 &
          echo "$!" > "$RUNNER_TEMP/ch.pid"
          "$RUNNER_TEMP/vm-bin/victoria-metrics-prod" -storageDataPath="$RUNNER_TEMP/vm/data" \
            -httpListenAddr=127.0.0.1:8430 -search.disableCache > evidence/vm-server.log 2>&1 &
          echo "$!" > "$RUNNER_TEMP/vm.pid"
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:18191/ping >/dev/null 2>&1 \
               && curl -fsS --max-time 2 http://127.0.0.1:8430/health >/dev/null 2>&1; then
              echo ready
              exit 0
            fi
            sleep 2
          done
          tail -100 evidence/ch-server.log evidence/vm-server.log
          exit 1
      - name: Generate identical data and load both engines
        run: |
          set -euo pipefail
          python3 .github/ts-lab-bench/generate.py --outdir "$RUNNER_TEMP/data" \
            --series "$SERIES" --points 120 --step 60 > evidence/manifest.json
          curl -fsS -X POST --data-binary "CREATE TABLE bench_ts_$SERIES ENGINE=TimeSeries" \
            'http://127.0.0.1:18191/?allow_experimental_time_series_table=1' \
            -o evidence/ch-create-response.txt || { tail -50 evidence/ch-server.log; exit 1; }
          curl -fsS -X POST --max-time 300 -o evidence/ch-load-response.txt -w 'CH load_seconds=%{time_total}\n' \
            --data-binary "@$RUNNER_TEMP/data/ch-import.jsonl" \
            "http://127.0.0.1:18191/?allow_experimental_time_series_table=1&wait_end_of_query=1&query=INSERT%20INTO%20bench_ts_$SERIES%20%28metric_name%2Ctags%2Csamples%29%20FORMAT%20JSONEachRow" | tee evidence/ch-load-time.txt
          curl -fsS -X POST --max-time 300 -o evidence/vm-load-response.txt -w 'VM load_seconds=%{time_total}\n' \
            --data-binary "@$RUNNER_TEMP/data/vm-import.prom" \
            http://127.0.0.1:8430/api/v1/import/prometheus | tee evidence/vm-load-time.txt
          du -sb "$RUNNER_TEMP/ch/data" "$RUNNER_TEMP/vm/data" | tee evidence/storage-bytes.txt
      - name: Wait until VictoriaMetrics indexes all imported samples
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,time,urllib.parse,urllib.request
          manifest=json.load(open(os.environ['RUNNER_TEMP']+'/data/manifest.json'))
          expected=int(os.environ['SERIES'])
          params=urllib.parse.urlencode(dict(query='count(bench_metric)',time=manifest['eval_end_epoch'],nocache='1'))
          url='http://127.0.0.1:8430/api/v1/query?'+params
          for attempt in range(120):
              with urllib.request.urlopen(url,timeout=15) as response:result=json.load(response)
              vals=result.get('data',{}).get('result',[])
              count=float(vals[0]['value'][1]) if vals else 0
              if count == expected:break
              time.sleep(1)
          else:raise RuntimeError(f'VM count={count}, expected={expected}; response={result}')
          status={'run':os.environ['GITHUB_RUN_ID'],'series':expected,'visible':count,'visibility_attempt':attempt+1}
          print(json.dumps(status))
          pathlib.Path('evidence/vm-visibility.json').write_text(json.dumps(status,indent=2)+'\n')
          PY
      - name: Adapt SQL generator manifest for native PromQL comparison
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'data'/'manifest.json'
          m=json.loads(path.read_text())
          m.update(metric='bench_metric',query_start_epoch=m['eval_start_epoch'],query_end_epoch=m['eval_end_epoch'])
          path.write_text(json.dumps(m,indent=2)+'\n')
          print('NATIVE_MANIFEST',json.dumps(m),flush=True)
          PY
      - name: Benchmark native baseline vs VM on identical series
        run: |
          set -euo pipefail
          python3 .github/ts-lab-pending/bench_long14_http.py \
            --manifest "$RUNNER_TEMP/data/manifest.json" \
            --ch http://127.0.0.1:18191 --vm http://127.0.0.1:8430 \
            --ch-pid "$(cat "$RUNNER_TEMP/ch.pid")" --vm-pid "$(cat "$RUNNER_TEMP/vm.pid")" \
            --label dense-baseline --table "bench_ts_$SERIES" --steps 60 --repeats 5 \
            --output evidence/queries | tee evidence/dense-baseline.log
      - name: Fetch adaptive-grid binary with SHA256 check
        env:
          ADAPTIVE_RUN: '41319688851'
          ADAPTIVE_SHA: 6648c1f0f1a6fbf97c7941c015953efbb2083a16
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/adaptive-art" "$RUNNER_TEMP/adaptive-bin"
          gh run download "$ADAPTIVE_RUN" -R "$REPO" -n "tslab-adaptive-binary-$ADAPTIVE_SHA" -D "$RUNNER_TEMP/adaptive-art"
          archive="$(find "$RUNNER_TEMP/adaptive-art" -name clickhouse-adaptive-linux-amd64.tar.zst -type f -print -quit)"
          test -s "$archive"
          (cd "$(dirname "$archive")" && sha256sum -c ARCHIVE_SHA256SUMS) | tee evidence/adaptive-archive-sha.txt
          zstd -dc "$archive" | tar -xf - -C "$RUNNER_TEMP/adaptive-bin"
          (cd "$RUNNER_TEMP/adaptive-bin" && sha256sum -c SHA256SUMS) | tee evidence/adaptive-binary-sha.txt
          chmod +x "$RUNNER_TEMP/adaptive-bin/clickhouse"
          "$RUNNER_TEMP/adaptive-bin/clickhouse" --version | tee evidence/adaptive-version.txt
      - name: Restart same TimeSeries data with adaptive binary and measure again
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/restart-clickhouse.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          binary="$1"
          label="$2"
          watch_pid="$(cat "$RUNNER_TEMP/ch.pid")"
          children="$(cat "/proc/$watch_pid/task/$watch_pid/children" 2>/dev/null || true)"
          for pid in "$watch_pid" $children; do
            if [ -n "$pid" ]; then kill -TERM "$pid" 2>/dev/null || true; fi
          done
          for i in $(seq 1 60); do
            if ! curl -fsS --max-time 1 http://127.0.0.1:18191/ping >/dev/null 2>&1; then break; fi
            sleep 1
          done
          if curl -fsS --max-time 1 http://127.0.0.1:18191/ping >/dev/null 2>&1; then
            echo "Old ClickHouse still has active HTTP listener" >&2
            exit 1
          fi
          "$binary" server --config-file="$RUNNER_TEMP/config.xml" > "evidence/ch-server-$label.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/ch.pid"
          for i in $(seq 1 120); do
            if curl -fsS --max-time 1 http://127.0.0.1:18191/ping >/dev/null 2>&1; then
              echo "RESTARTED $label at $i"
              exit 0
            fi
            sleep 1
          done
          tail -100 "evidence/ch-server-$label.log"
          exit 1
          SH
          chmod +x "$RUNNER_TEMP/restart-clickhouse.sh"
          "$RUNNER_TEMP/restart-clickhouse.sh" "$RUNNER_TEMP/adaptive-bin/clickhouse" adaptive
          python3 .github/ts-lab-pending/bench_long14_http.py \
            --manifest "$RUNNER_TEMP/data/manifest.json" \
            --ch http://127.0.0.1:18191 --vm http://127.0.0.1:8430 \
            --ch-pid "$(cat "$RUNNER_TEMP/ch.pid")" --vm-pid "$(cat "$RUNNER_TEMP/vm.pid")" \
            --label adaptive --table "bench_ts_$SERIES" --steps 60 --repeats 5 \
            --output evidence/adaptive-queries | tee evidence/adaptive-query-summary.log
      - name: Recheck baseline after adaptive run and compare raw 1m results
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/restart-clickhouse.sh" "$RUNNER_TEMP/ch-bin/clickhouse" baseline-recheck
          python3 .github/ts-lab-pending/bench_long14_http.py \
            --manifest "$RUNNER_TEMP/data/manifest.json" \
            --ch http://127.0.0.1:18191 --vm http://127.0.0.1:8430 \
            --ch-pid "$(cat "$RUNNER_TEMP/ch.pid")" --vm-pid "$(cat "$RUNNER_TEMP/vm.pid")" \
            --label baseline-recheck --table "bench_ts_$SERIES" --steps 60 --repeats 5 \
            --output evidence/recheck-queries | tee evidence/recheck-query-summary.log
          python3 - <<'PY'
          import gzip,json,math,pathlib,os
          root=pathlib.Path('evidence')
          def result(sub):
              return json.loads((root/sub/'summary.json').read_text())
          baseline=result('queries')
          adaptive=result('adaptive-queries')
          recheck=result('recheck-queries')
          def by_step(obj):return {x['step_seconds']:x for x in obj['cases']}
          ba=by_step(baseline);sa=by_step(adaptive);ra=by_step(recheck)
          def samples(folder,pattern):
              found=list((root/folder).glob(pattern))
              assert len(found)==1,found
              rows=[json.loads(s) for s in gzip.decompress(found[0].read_bytes()).decode().splitlines() if s.strip()]
              assert len(rows)==1,rows
              return rows[0]['samples']
          a=samples('queries','*clickhouse-1m-response.gz')
          b=samples('adaptive-queries','*clickhouse-1m-response.gz')
          c=samples('recheck-queries','*clickhouse-1m-response.gz')
          for candidate in [b,c]:
              assert len(candidate)==len(a)
              for (ta,va),(tb,vb) in zip(a,candidate):
                  assert ta==tb
                  assert math.isclose(float(va),float(vb),rel_tol=1e-12,abs_tol=1e-9),(ta,va,vb)
          comparison=[]
          for step in [60]:
              item={'step_seconds':step,'baseline_ch_p50_ms':ba[step]['clickhouse_p50_ms'],
                    'adaptive_ch_p50_ms':sa[step]['clickhouse_p50_ms'],
                    'adaptive_speedup':round(ba[step]['clickhouse_p50_ms']/sa[step]['clickhouse_p50_ms'],4),
                    'adaptive_vs_vm_p50':round(sa[step]['clickhouse_p50_ms']/sa[step]['victoria_p50_ms'],4),
                    'vm_before_ms':ba[step]['victoria_p50_ms'],
                    'vm_adaptive_ms':sa[step]['victoria_p50_ms'],
                    'max_rel_error_adaptive_vs_vm':sa[step]['comparison']['max_rel_error']}
              if step==60:
                  item['baseline_recheck_p50_ms']=ra[step]['clickhouse_p50_ms']
                  item['recheck_vs_baseline_ratio']=round(ra[step]['clickhouse_p50_ms']/ba[step]['clickhouse_p50_ms'],4)
              comparison.append(item)
          target={'source_run':41301314345,'adaptive_run':41319688851,
                  'query':'sum(rate(lab_node_network_receive_bytes_total[5m]))',
                  'same_runner_data':True,'baseline_adaptive_and_recheck_values_identical_1m':True,
                  'series':int(os.environ['SERIES']),'samples':int(os.environ['SERIES'])*120,'results':comparison}
          (root/'paired-comparison.json').write_text(json.dumps(target,indent=2)+'\n')
          print('PAIRED_ADAPTIVE_GRID',json.dumps(target,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tslab-dense-adaptive-aba-${{ matrix.series }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
