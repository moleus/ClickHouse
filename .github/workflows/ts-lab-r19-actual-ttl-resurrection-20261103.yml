name: R19 actual SAMPLES TTL expiration and late resumed series semantics
on:
  push:
    branches: [lab/ts-cbo-adaptive-20261103]
    paths: ['.github/workflows/ts-lab-r19-actual-ttl-resurrection-20261103.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ts-lab-r19-actual-ttl-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  r02:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: moleus/ClickHouse
      BINARY_SHA256: f0a2fa1f814c58853f43423705cac10ab9df3bfe5887e27ebe9620ba7cb9660e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Source and preflight
        run: |
          set -euo pipefail
          mkdir -p evidence/r19ttl
          test "$(readlink AGENTS.md)" = .claude/CLAUDE.md
          test "$(git ls-files -s AGENTS.md | cut -d' ' -f1)" = 120000
          python3 -m py_compile .github/ts-lab/experiments/r02_small_batch_write_merge.py .github/ts-lab/experiments/r19_ttl_resurrection_semantics.py
          python3 .github/ts-lab/experiments/r19_ttl_resurrection_semantics.py --help > evidence/r19ttl/help.txt
          git rev-parse HEAD > evidence/r19ttl/workflow-head.txt
          sha256sum .github/ts-lab/experiments/r02_small_batch_write_merge.py .github/ts-lab/experiments/r19_ttl_resurrection_semantics.py > evidence/r19ttl/script-sha256.txt
      - name: Reuse pinned SHA verified O1 binary (no recompilation)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r19ttl-art" "$RUNNER_TEMP/r19ttl-bin"
          gh run download 41596421285 -R "$REPO" \
            --pattern 'tslab-stock-clickhouse-o1-binary-*' \
            -D "$RUNNER_TEMP/r19ttl-art"
          archive="$(find "$RUNNER_TEMP/r19ttl-art" -name 'clickhouse-stock-clickhouse-o1-linux-amd64.tar.zst' -type f -print -quit)"
          test -s "$archive"
          (cd "$(dirname "$archive")" && sha256sum -c ARCHIVE_SHA256SUMS) | tee evidence/r19ttl/archive-verify.txt
          zstd -dc "$archive" | tar -xf - -C "$RUNNER_TEMP/r19ttl-bin"
          (cd "$RUNNER_TEMP/r19ttl-bin" && sha256sum -c SHA256SUMS) | tee evidence/r19ttl/binary-verify.txt
          test "$(sha256sum "$RUNNER_TEMP/r19ttl-bin/clickhouse" | cut -d' ' -f1)" = "$BINARY_SHA256"
          grep -q 'source=52529f0c711566d696917678bf15e7068772fdde' "$RUNNER_TEMP/r19ttl-bin/BUILD_INFO.txt"
          grep -q 'optimization=O1 unmodified stock source no lab patches' "$RUNNER_TEMP/r19ttl-bin/BUILD_INFO.txt"
          cp "$RUNNER_TEMP/r19ttl-bin/BUILD_INFO.txt" evidence/r19ttl/build-info.txt
          chmod +x "$RUNNER_TEMP/r19ttl-bin/clickhouse"
          "$RUNNER_TEMP/r19ttl-bin/clickhouse" --version | tee evidence/r19ttl/version.txt
      - name: Start isolated ClickHouse with query_log and bounded memory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r19ttl"/{data,tmp,userfiles}
          cat > "$RUNNER_TEMP/r19ttl/config.xml" <<EOF
          <clickhouse>
            <logger><level>warning</level><console>true</console></logger>
            <listen_host>127.0.0.1</listen_host><http_port>18191</http_port><tcp_port>19000</tcp_port>
            <path>$RUNNER_TEMP/r19ttl/data/</path><tmp_path>$RUNNER_TEMP/r19ttl/tmp/</tmp_path>
            <user_files_path>$RUNNER_TEMP/r19ttl/userfiles/</user_files_path>
            <max_server_memory_usage>2800000000</max_server_memory_usage>
            <users><default><password></password><networks><ip>127.0.0.1</ip></networks><profile>default</profile><quota>default</quota></default></users>
            <profiles><default><allow_experimental_time_series_table>1</allow_experimental_time_series_table><enable_time_series_aggregate_functions>1</enable_time_series_aggregate_functions><max_threads>2</max_threads><max_memory_usage>1800000000</max_memory_usage><log_queries>1</log_queries></default></profiles>
            <quotas><default><interval><duration>3600</duration></interval></default></quotas>
            <query_log><database>system</database><table>query_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></query_log>
            <part_log><database>system</database><table>part_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></part_log>
            <default_profile>default</default_profile><default_database>default</default_database>
          </clickhouse>
          EOF
          "$RUNNER_TEMP/r19ttl-bin/clickhouse" server --config-file="$RUNNER_TEMP/r19ttl/config.xml" > evidence/r19ttl/server.log 2>&1 &
          echo "$!" > evidence/r19ttl/server.pid
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS --max-time 1 http://127.0.0.1:18191/ping > evidence/r19ttl/ping.txt 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then tail -100 evidence/r19ttl/server.log; exit 1; fi
      - name: Materialize real 30d SAMPLES TTL and test late and resumed series
        run: |
          set -euo pipefail
          python3 .github/ts-lab/experiments/r19_ttl_resurrection_semantics.py \
            --endpoint http://127.0.0.1:18191/ \
            --out evidence/r19ttl/report.json | tee evidence/r19ttl/console.log
          python3 - <<'PY'
          import json
          d=json.load(open('evidence/r19ttl/report.json'))
          assert d['passed'] and not d['errors'],d.get('errors')
          assert d['ttl_days']==30
          assert sorted(d['checkpoints'])==['post_ingest','post_late','post_resume','post_ttl','ttl_zero_row_parts']
          assert d['checkpoints']['post_ttl']['samples_rows']==16
          assert d['checkpoints']['post_late']['samples_rows']==16
          assert d['checkpoints']['post_resume']['samples_rows']==17
          assert d['checkpoints']['post_ttl']['tags_rows']==144
          assert d['checkpoints']['post_ttl']['timeranges_rows']==144
          assert d['checkpoints']['post_resume']['tags_rows']==144
          assert d['checkpoints']['post_resume']['timeranges_rows']==144
          assert d['checkpoints']['post_ttl']['native']['points']==1
          assert d['checkpoints']['post_resume']['native']['points']==2
          print('R19_TTL_VALIDATED',json.dumps({'passed':True,
                'source':d['source_sha'],'fixture':d['fixture_sha256'],
                'checkpoints':list(d['checkpoints'])}))

          PY
      - name: Preserve raw correct and failed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tslab-r19-actual-ttl-${{ github.run_id }}
          path: |
            evidence/r19ttl/*.txt
            evidence/r19ttl/*.log
            evidence/r19ttl/*.json
            evidence/r19ttl/phase-*/report.json
            evidence/r19ttl/phase-*/config.xml
            evidence/r19ttl/phase-*/server.log
          if-no-files-found: error
          retention-days: 45
          compression-level: 1
