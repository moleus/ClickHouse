name: R40 cumulative compiler R35 R37 R38 native oracle and plans
on:
  push:
    branches: [lab/ts-cbo-adaptive-20261103]
    paths: ['.github/workflows/ts-lab-r40-native-guards-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tslab-r40-guards-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  native-guards:
    runs-on: ${{ vars.CH_BENCH_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 50
    env:
      TS_LAB_ROOT: /tmp/tslab-r40-guards
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preflight scripts and research branch
        run: |
          set -euo pipefail
          python3 -m py_compile .github/ts-lab-r40/guard_suite.py .github/ts-lab-r35/native.py
          mkdir -p "$TS_LAB_ROOT" evidence
      - name: Download exact r35 binary
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41732238195
          name: tslab-r35-metric-drop-o2-binary-49eb57195e808efb818a3517bc15bc8706e51e03
          path: ${{ runner.temp }}/r35-artifact
      - name: Download exact r37 binary
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41789987661
          name: tslab-r37-injective-projection-o2-binary-2227b7f92489fc216d1b7973325b63be29467bc3
          path: ${{ runner.temp }}/r37-artifact
      - name: Download exact r38 binary
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41791235811
          name: tslab-r38-without-deferral-o2-binary-0386d9d55fb1de9bb0955689e15c53e4f076d096
          path: ${{ runner.temp }}/r38-artifact
      - name: Download exact r40 binary
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41797918745
          name: tslab-r40-cumulative-compiler-o2-binary-75ebe4413ad804580d9d5a5dec8fbba104362fc2
          path: ${{ runner.temp }}/r40-artifact
      - name: Verify all binary SHA256 and install
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zstd
          for v in r35; do
            mapfile -t archives < <(find "$RUNNER_TEMP/$v-artifact" -name "clickhouse-$v-*.tar.zst" -type f)
            test "${#archives[@]}" -eq 1
            mkdir -p "$RUNNER_TEMP/extract-$v"
            tar -I unzstd -xf "${archives[0]}" -C "$RUNNER_TEMP/extract-$v"
            (cd "$RUNNER_TEMP/extract-$v" && sha256sum -c SHA256SUMS)
            echo "68d6e8f954a44beeb137acea61b0b77afac32cc705e59404413c233b57e6a06b  $RUNNER_TEMP/extract-$v/clickhouse" | sha256sum -c -
          done
          mkdir -p "$TS_LAB_ROOT/r35-metric-drop-o2/bin"
          cp "$RUNNER_TEMP/extract-r35/clickhouse" "$TS_LAB_ROOT/r35-metric-drop-o2/bin/clickhouse"
          for v in r37; do
            mapfile -t archives < <(find "$RUNNER_TEMP/$v-artifact" -name "clickhouse-$v-*.tar.zst" -type f)
            test "${#archives[@]}" -eq 1
            mkdir -p "$RUNNER_TEMP/extract-$v"
            tar -I unzstd -xf "${archives[0]}" -C "$RUNNER_TEMP/extract-$v"
            (cd "$RUNNER_TEMP/extract-$v" && sha256sum -c SHA256SUMS)
            echo "270766fff7c22007c40d2d6e13f2c76a26587aed7ad605c13b70793f2740c6bc  $RUNNER_TEMP/extract-$v/clickhouse" | sha256sum -c -
          done
          mkdir -p "$TS_LAB_ROOT/r37-injective-projection-o2/bin"
          cp "$RUNNER_TEMP/extract-r37/clickhouse" "$TS_LAB_ROOT/r37-injective-projection-o2/bin/clickhouse"
          for v in r38; do
            mapfile -t archives < <(find "$RUNNER_TEMP/$v-artifact" -name "clickhouse-$v-*.tar.zst" -type f)
            test "${#archives[@]}" -eq 1
            mkdir -p "$RUNNER_TEMP/extract-$v"
            tar -I unzstd -xf "${archives[0]}" -C "$RUNNER_TEMP/extract-$v"
            (cd "$RUNNER_TEMP/extract-$v" && sha256sum -c SHA256SUMS)
            echo "03dcb8ae1fba6d3fd4a41afb608f1af88a1fb7fd16ef6e8c58ae061629a810ea  $RUNNER_TEMP/extract-$v/clickhouse" | sha256sum -c -
          done
          mkdir -p "$TS_LAB_ROOT/r38-without-deferral-o2/bin"
          cp "$RUNNER_TEMP/extract-r38/clickhouse" "$TS_LAB_ROOT/r38-without-deferral-o2/bin/clickhouse"
          for v in r40; do
            mapfile -t archives < <(find "$RUNNER_TEMP/$v-artifact" -name "clickhouse-$v-*.tar.zst" -type f)
            test "${#archives[@]}" -eq 1
            mkdir -p "$RUNNER_TEMP/extract-$v"
            tar -I unzstd -xf "${archives[0]}" -C "$RUNNER_TEMP/extract-$v"
            (cd "$RUNNER_TEMP/extract-$v" && sha256sum -c SHA256SUMS)
            echo "522bbe374eb73727142bcd6239a7beb62a983c2f5a29a7f8b3456446c5536653  $RUNNER_TEMP/extract-$v/clickhouse" | sha256sum -c -
          done
          mkdir -p "$TS_LAB_ROOT/r40-cumulative-compiler-o2/bin"
          cp "$RUNNER_TEMP/extract-r40/clickhouse" "$TS_LAB_ROOT/r40-cumulative-compiler-o2/bin/clickhouse"
      - name: r35 native semantic and plan reference
        run: |
          set -euo pipefail
          python3 .github/ts-lab-r40/guard_suite.py r35 | tee evidence/r35.log
          cp "$TS_LAB_ROOT/guard-r35.json" evidence/
      - name: r37 native semantic and plan reference
        run: |
          set -euo pipefail
          python3 .github/ts-lab-r40/guard_suite.py r37 | tee evidence/r37.log
          cp "$TS_LAB_ROOT/guard-r37.json" evidence/
      - name: r38 native semantic and plan reference
        run: |
          set -euo pipefail
          python3 .github/ts-lab-r40/guard_suite.py r38 | tee evidence/r38.log
          cp "$TS_LAB_ROOT/guard-r38.json" evidence/
      - name: r40 native semantic and plan reference
        run: |
          set -euo pipefail
          python3 .github/ts-lab-r40/guard_suite.py r40 | tee evidence/r40.log
          cp "$TS_LAB_ROOT/guard-r40.json" evidence/
      - name: Upload guard evidence on all outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tslab-r40-native-guards-${{ github.sha }}
          path: |
            evidence/
            ${{ env.TS_LAB_ROOT }}/guard-*.json
          compression-level: 4
          retention-days: 45
          if-no-files-found: warn
