name: R16 VM 165k unique-series cap vs ClickHouse 1.33m 14d native ABBA

on:
  push:
    branches: [lab/ts-cbo-adaptive-20261103]
    paths: ['.github/workflows/ts-lab-r16-highcard165k-20261103.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tslab-r16-highcard-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: moleus/ClickHouse
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate checkout and fail-fast benchmark imports
        run: |
          set -euo pipefail
          test "$(readlink AGENTS.md)" = .claude/CLAUDE.md
          test "$(git ls-files -s AGENTS.md | awk '{print $1}')" = 120000
          python3 -m py_compile \
            .github/ts-lab-cpu/bench_native_multiclient_stock_20261103.py \
            .github/ts-lab-r01/generate_k8s_churn_fixture.py \
            .github/ts-lab-r01/test_generate_k8s_churn_fixture.py \
            .github/ts-lab-r01/bench_k8s_mixed_native.py \
            .github/ts-lab-r10/bench_bucket_id_factorial.py \
            .github/ts-lab-r10/bench_short_window_pruning.py \
            .github/ts-lab-r10/bench_write_bucket_paired.py \
            .github/ts-lab-r10/bench_bucket_concurrent_clients.py \
            .github/ts-lab-r03/import_k8s_mixed_vm.py \
            .github/ts-lab-r03/bench_native_vm_concurrency.py \
            .github/ts-lab-r16/bench_highcard_14d_cap.py \
            .github/ts-lab-bench/generate_95k_daily_churn_ts.py \
            .github/ts-lab-bench/import_95k_churn_to_vm.py \
            .github/ts-lab/experiments/r02_small_batch_write_merge.py \
            .github/ts-lab-cpu/bench_cpu_knobs.py \
            .github/ts-lab-layout/bench_metadata_paths.py \
            .github/ts-lab-layout/bench_layout_full.py \
            .github/ts-lab-perf/bench_granularity_v11.py
          python3 .github/ts-lab-layout/bench_metadata_paths.py --help >/dev/null
          python3 .github/ts-lab-cpu/bench_native_multiclient_stock_20261103.py --help >/dev/null
          python3 -m unittest discover -s .github/ts-lab-r01 -p 'test_generate_k8s_churn_fixture.py' -v
          python3 .github/ts-lab-r01/bench_k8s_mixed_native.py --help >/dev/null
          python3 .github/ts-lab-r10/bench_bucket_id_factorial.py --help >/dev/null
          python3 .github/ts-lab-r10/bench_short_window_pruning.py --help >/dev/null
          python3 .github/ts-lab-r10/bench_write_bucket_paired.py --help >/dev/null
          python3 .github/ts-lab-r10/bench_bucket_concurrent_clients.py --help >/dev/null
          python3 .github/ts-lab-r03/import_k8s_mixed_vm.py --help >/dev/null
          python3 .github/ts-lab-r03/bench_native_vm_concurrency.py --help >/dev/null
          python3 .github/ts-lab-r16/bench_highcard_14d_cap.py --help >/dev/null
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/workflow-commit.txt
          uname -a | tee evidence/runner-kernel.txt
          nproc | tee evidence/runner-logical-cpus.txt
          grep -m1 '^model name' /proc/cpuinfo | tee evidence/runner-cpu.txt
          free -b | tee evidence/runner-memory.txt

      - name: Restore immutable pinned stock O1 binary and verify archive and executable
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ch-art" "$RUNNER_TEMP/ch-bin"
          gh run download 41596421285 -R "$REPO" \
            --pattern 'tslab-stock-clickhouse-o1-binary-*' \
            -D "$RUNNER_TEMP/ch-art"
          archive="$(find "$RUNNER_TEMP/ch-art" -name 'clickhouse-stock-clickhouse-o1-linux-amd64.tar.zst' -type f -print -quit)"
          test -s "$archive"
          (cd "$(dirname "$archive")" && sha256sum -c ARCHIVE_SHA256SUMS) | tee evidence/ch-stock-archive-hash.txt
          zstd -dc "$archive" | tar -xf - -C "$RUNNER_TEMP/ch-bin"
          (cd "$RUNNER_TEMP/ch-bin" && sha256sum -c SHA256SUMS) | tee evidence/ch-stock-binary-hash.txt
          test "$(grep '^source=' "$RUNNER_TEMP/ch-bin/BUILD_INFO.txt")" = \
            "source=52529f0c711566d696917678bf15e7068772fdde"
          grep -q 'optimization=O1 unmodified stock source no lab patches' "$RUNNER_TEMP/ch-bin/BUILD_INFO.txt"
          cp "$RUNNER_TEMP/ch-bin/BUILD_INFO.txt" evidence/BUILD_INFO.txt
          "$RUNNER_TEMP/ch-bin/clickhouse" --version | tee evidence/clickhouse-version.txt
          sha256sum "$RUNNER_TEMP/ch-bin/clickhouse" | tee evidence/clickhouse-binary-sha256.txt
          test "$(sha256sum "$RUNNER_TEMP/ch-bin/clickhouse" | awk '{print $1}')" = \
            "f0a2fa1f814c58853f43423705cac10ab9df3bfe5887e27ebe9620ba7cb9660e"

      - name: Start isolated stock ClickHouse with native tracing and bounded memory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ch/data" "$RUNNER_TEMP/ch/tmp" "$RUNNER_TEMP/ch/userfiles"
          cat > "$RUNNER_TEMP/config.xml" <<EOF
          <clickhouse>
            <logger><level>warning</level><console>true</console></logger>
            <listen_host>127.0.0.1</listen_host>
            <http_port>18191</http_port><tcp_port>19000</tcp_port>
            <path>$RUNNER_TEMP/ch/data/</path><tmp_path>$RUNNER_TEMP/ch/tmp/</tmp_path>
            <user_files_path>$RUNNER_TEMP/ch/userfiles/</user_files_path>
            <max_server_memory_usage>4800000000</max_server_memory_usage>
            <users>
              <default><password></password>
              <networks><ip>127.0.0.1</ip></networks>
              <profile>default</profile><quota>default</quota></default>
            </users>
            <profiles><default>
              <allow_experimental_time_series_table>1</allow_experimental_time_series_table>
              <enable_time_series_aggregate_functions>1</enable_time_series_aggregate_functions>
              <log_queries>1</log_queries>
              <log_processors_profiles>1</log_processors_profiles>
              <log_query_threads>1</log_query_threads>
              <use_statistics>1</use_statistics>
              <query_profiler_cpu_time_period_ns>1000000</query_profiler_cpu_time_period_ns>
              <max_memory_usage>3500000000</max_memory_usage>
            </default></profiles>
            <quotas><default><interval><duration>3600</duration></interval></default></quotas>
            <query_log><database>system</database><table>query_log</table>
              <flush_interval_milliseconds>1000</flush_interval_milliseconds></query_log>
            <part_log><database>system</database><table>part_log</table>
              <flush_interval_milliseconds>1000</flush_interval_milliseconds></part_log>
            <query_thread_log><database>system</database><table>query_thread_log</table>
              <flush_interval_milliseconds>1000</flush_interval_milliseconds></query_thread_log>
            <trace_log><database>system</database><table>trace_log</table>
              <flush_interval_milliseconds>1000</flush_interval_milliseconds></trace_log>
            <processors_profile_log><database>system</database><table>processors_profile_log</table>
              <flush_interval_milliseconds>1000</flush_interval_milliseconds></processors_profile_log>
            <default_profile>default</default_profile>
            <default_database>default</default_database>
          </clickhouse>
          EOF
          "$RUNNER_TEMP/ch-bin/clickhouse" server --config-file="$RUNNER_TEMP/config.xml" \
            >evidence/ch-server.log 2>&1 &
          echo "$!" > "$RUNNER_TEMP/ch.pid"
          for i in $(seq 1 100); do
            if curl -fsS --max-time 1 http://127.0.0.1:18191/ping >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS --max-time 3 http://127.0.0.1:18191/ping
          curl -fsS -X POST --data-binary 'SELECT version()' \
            http://127.0.0.1:18191/ | tee evidence/server-version.txt

      - name: Generate 1.33m daily high-churn 14d source fixture and verify hash
        run: |
          set -euo pipefail
          mkdir -p evidence/r16
          python3 -u .github/ts-lab-bench/generate_95k_daily_churn_ts.py \
            --manifest evidence/r16/manifest.json \
            --fixture "$RUNNER_TEMP/r16-churn.jsonl" \
            | tee evidence/r16/generate.log
          sha256sum "$RUNNER_TEMP/r16-churn.jsonl" | tee evidence/r16/fixture.sha256
          test "$(sha256sum "$RUNNER_TEMP/r16-churn.jsonl" | awk '{print $1}')" = \
            8f3a36846f80d6be5a8604d142e934399f2687094766c57bf105e43977f52858
          python3 - <<'PY'
          import json,pathlib
          m=json.loads(pathlib.Path('evidence/r16/manifest.json').read_text())
          assert m['days']==14 and m['per_day']==95000 and m['series']==1330000
          print('R16_SOURCE_INPUT',json.dumps(m,sort_keys=True),flush=True)
          PY

      - name: Download verified VM1.134.0 baseline and start cache-disabled server
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vm-art" "$RUNNER_TEMP/vm-bin" "$RUNNER_TEMP/vm/data" evidence/r16
          gh run download 41288854734 -R "$REPO" \
            -n tslab-victoria-metrics-v1.134.0 -D "$RUNNER_TEMP/vm-art"
          (cd "$RUNNER_TEMP/vm-art" && sed 's#  output/#  #' SHA256SUMS | sha256sum -c -) \
            | tee evidence/r16/vm-archive-sha256.txt
          test "$(sha256sum "$RUNNER_TEMP/vm-art/victoria-metrics-linux-amd64-v1.134.0.tar.gz" | awk '{print $1}')" = \
            "cd6e109bae85ff7c138d838b32be9a7fe2a6d7a9b3a387a7cf9234f22991da10"
          tar -xzf "$RUNNER_TEMP/vm-art/victoria-metrics-linux-amd64-v1.134.0.tar.gz" \
            -C "$RUNNER_TEMP/vm-bin"
          chmod +x "$RUNNER_TEMP/vm-bin/victoria-metrics-prod"
          "$RUNNER_TEMP/vm-bin/victoria-metrics-prod" --version 2>&1 \
            | head -n 6 | tee evidence/r16/vm-version.txt
          sha256sum "$RUNNER_TEMP/vm-bin/victoria-metrics-prod" \
            | tee evidence/r16/vm-binary-sha256.txt
          "$RUNNER_TEMP/vm-bin/victoria-metrics-prod" \
            -storageDataPath="$RUNNER_TEMP/vm/data" \
            -httpListenAddr=127.0.0.1:8430 \
            -retentionPeriod=6 \
            -search.maxUniqueTimeseries=165000 \
            -search.disableCache \
            -memory.allowedBytes=4294967296 \
            >evidence/r16/vm-server.log 2>&1 &
          echo "$!" > "$RUNNER_TEMP/vm.pid"
          for i in $(seq 1 90); do
            if ! kill -0 "$(cat "$RUNNER_TEMP/vm.pid")" 2>/dev/null; then
              tail -80 evidence/r16/vm-server.log
              exit 1
            fi
            if curl -fsS --max-time 2 http://127.0.0.1:8430/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS --max-time 2 http://127.0.0.1:8430/health \
            | tee evidence/r16/vm-health.txt
          printf 'VM uses 165k matching series cap, no response cache, and 4GiB VM cache budget.\n' \
            > evidence/r16/allocator-limit-note.txt

      - name: Import exact 1.33m source samples into VictoriaMetrics and verify final-day visibility
        run: |
          set -euo pipefail
          python3 -u .github/ts-lab-bench/import_95k_churn_to_vm.py \
            --fixture "$RUNNER_TEMP/r16-churn.jsonl" \
            --manifest evidence/r16/manifest.json \
            --output evidence/r16/vm-import.json \
            | tee evidence/r16/vm-import.log
          PYTHONPATH=.github/ts-lab-bench python3 - <<'PY' | tee evidence/r16/vm-visibility.log
          import json,pathlib
          from bench_95k_daily_vs_vm import ready
          ready(json.loads(pathlib.Path('evidence/r16/manifest.json').read_text()))
          PY

      - name: Test actual 165k VM cap and stage14d full-native VM CH CH VM at 1 4 8 clients
        run: |
          set -euo pipefail
          echo 'No timed RSS polling; nanosecond schedstat CPU; VM query errors are never latency samples' \
            > evidence/r16/revision.txt
          python3 -u .github/ts-lab-r16/bench_highcard_14d_cap.py \
            --fixture "$RUNNER_TEMP/r16-churn.jsonl" \
            --manifest evidence/r16/manifest.json \
            --vm-import evidence/r16/vm-import.json \
            --ch-pid-file "$RUNNER_TEMP/ch.pid" \
            --vm-pid-file "$RUNNER_TEMP/vm.pid" \
            --ch-binary "$RUNNER_TEMP/ch-bin/clickhouse" \
            --output evidence/r16/report.json \
            | tee evidence/r16/compare.log
          du -sb "$RUNNER_TEMP/ch/data" "$RUNNER_TEMP/vm/data" \
            > evidence/r16/storage-bytes.tsv

      - name: Retain 165k error evidence and full stage ABBA CPU parity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tslab-r16-highcard-165k-${{ github.run_id }}
          path: evidence/
          retention-days: 45
          compression-level: 1
