name: R30 full native PromQL source-matched O2 stock vs ANY ABBA
on:
  push:
    branches: [lab/ts-cbo-adaptive-20261103]
    paths: ['.github/workflows/ts-lab-r30-native-o2-matched-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tslab-r30-native-o2-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: moleus/ClickHouse
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Preflight lab symlink, native ABBA and source parity assertions
        run: |
          set -euo pipefail
          test "$(readlink AGENTS.md)" = ".claude/CLAUDE.md"
          test "$(git ls-files -s AGENTS.md | awk '{print $1}')" = 120000
          python3 -m py_compile .github/ts-lab-r30/bench_native_any_o2_matched.py
          python3 -m unittest discover -s .github/ts-lab-r30 -p 'test_native_any_o2_matched.py' -v
          mkdir -p evidence/r30-native
          git rev-parse HEAD > evidence/r30-native/workflow-commit.txt
          nproc > evidence/r30-native/runner-cpus.txt
          free -b > evidence/r30-native/runner-memory.txt
      - name: Retrieve and verify R29 original source O2 jemalloc binary
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r30-stock-art" "$RUNNER_TEMP/r30-stock-bin"
          gh run download 41685467438 -R "$REPO" --pattern 'tslab-r29-stock-o2-jemalloc-binary-*' -D "$RUNNER_TEMP/r30-stock-art"
          archive="$(find "$RUNNER_TEMP/r30-stock-art" -name 'clickhouse-stock-clickhouse-o2-jemalloc-linux-amd64.tar.zst' -type f -print -quit)"
          test -s "$archive"
          (cd "$(dirname "$archive")" && sha256sum -c ARCHIVE_SHA256SUMS) > evidence/r30-native/stock-archive-verified.txt
          zstd -dc "$archive" | tar -xf - -C "$RUNNER_TEMP/r30-stock-bin"
          (cd "$RUNNER_TEMP/r30-stock-bin" && sha256sum -c SHA256SUMS) > evidence/r30-native/stock-binary-verified.txt
          test "$(sha256sum "$RUNNER_TEMP/r30-stock-bin/clickhouse" | awk '{print $1}')" = '5d629ddfda91919402fdf8475ec3da9fe718d48ef386bc51be677264df6dc9ef'
          grep -q '^source=52529f0c711566d696917678bf15e7068772fdde$' "$RUNNER_TEMP/r30-stock-bin/BUILD_INFO.txt"
          grep -q '^optimization=O2 USE_JEMALLOC=1 unmodified stock source no lab patches$' "$RUNNER_TEMP/r30-stock-bin/BUILD_INFO.txt"
          cp "$RUNNER_TEMP/r30-stock-bin/BUILD_INFO.txt" evidence/r30-native/stock-build-info.txt
          chmod +x "$RUNNER_TEMP/r30-stock-bin/clickhouse"
          "$RUNNER_TEMP/r30-stock-bin/clickhouse" --version | tee evidence/r30-native/stock-version.txt
      - name: Retrieve and verify R30 exactly one-site ANY O2 jemalloc binary
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r30-any-art" "$RUNNER_TEMP/r30-any-bin"
          gh run download 41723209512 -R "$REPO" --pattern 'tslab-r30-any-stock-o2-jemalloc-binary-*' -D "$RUNNER_TEMP/r30-any-art"
          archive="$(find "$RUNNER_TEMP/r30-any-art" -name 'clickhouse-r30-any-o2-jemalloc-linux-amd64.tar.zst' -type f -print -quit)"
          test -s "$archive"
          (cd "$(dirname "$archive")" && sha256sum -c ARCHIVE_SHA256SUMS) > evidence/r30-native/any-archive-verified.txt
          zstd -dc "$archive" | tar -xf - -C "$RUNNER_TEMP/r30-any-bin"
          (cd "$RUNNER_TEMP/r30-any-bin" && sha256sum -c SHA256SUMS) > evidence/r30-native/any-binary-verified.txt
          test "$(sha256sum "$RUNNER_TEMP/r30-any-bin/clickhouse" | awk '{print $1}')" = 'aa857ccff473837a37772c04825d8adcd0fbf1dc48d16d1841e2baafab14a59c'
          grep -q '^source=52529f0c711566d696917678bf15e7068772fdde$' "$RUNNER_TEMP/r30-any-bin/BUILD_INFO.txt"
          grep -q '^optimization=O2 USE_JEMALLOC=1 R30_TIME_RANGES_ANY=1 single source AST delta$' "$RUNNER_TEMP/r30-any-bin/BUILD_INFO.txt"
          cp "$RUNNER_TEMP/r30-any-bin/BUILD_INFO.txt" evidence/r30-native/any-build-info.txt
          chmod +x "$RUNNER_TEMP/r30-any-bin/clickhouse"
          "$RUNNER_TEMP/r30-any-bin/clickhouse" --version | tee evidence/r30-native/any-version.txt
          sha256sum "$RUNNER_TEMP/r30-stock-bin/clickhouse" "$RUNNER_TEMP/r30-any-bin/clickhouse" > evidence/r30-native/binary-comparison-sha256.txt
      - name: Full native PromQL ABBA preserving Atomic symlinks in each restored snapshot
        run: |
          set -euo pipefail
          python3 -u .github/ts-lab-r30/bench_native_any_o2_matched.py \
            --stock "$RUNNER_TEMP/r30-stock-bin/clickhouse" \
            --candidate "$RUNNER_TEMP/r30-any-bin/clickhouse" \
            --work "$RUNNER_TEMP/r30-native-work" \
            --out evidence/r30-native --series 4096 --updates 16 \
            | tee evidence/r30-native-run.log
      - name: Record scientific conclusion independently of workflow success
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('evidence/r30-native/report.json')
          if p.exists():
              r=json.loads(p.read_text())
              print('R30_NATIVE_STATUS',r.get('status'),'errors',r.get('errors'),
                    'phases',len(r.get('phases',[])))
              for case,modes in r.get('summary',{}).items():
                  print('R30_NATIVE_CASE',case,{
                    k:{metric:z.get(metric) for metric in ('wall_ms','cpu_ms','query_memory_bytes','control_wall_drift')}
                    for k,z in modes.items()})
          else:print('R30_NATIVE_REPORT_MISSING')
          PY
      - name: Preserve exact full native outputs, RSS, invalid results and physical parts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tslab-r30-full-native-any-o2-evidence
          path: |
            evidence/r30-native/
            evidence/r30-native-run.log
          retention-days: 45
          compression-level: 1
