name: R40 combined native R35 R37 R38 compiler O2 jemalloc
on:
  push:
    branches: [lab/ts-cbo-adaptive-20261103]
    paths: ['.github/workflows/ts-lab-r40-cumulative-compiler-o2-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tslab-r40-cumulative-compiler-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  clickhouse:
    runs-on: ${{ vars.CH_BUILD_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      SOURCE_SHA: 52529f0c711566d696917678bf15e7068772fdde
      LLVM_VERSION: 22.1.8
      LLVM_SHA256: 8d5d1e52a06e1c10e457fd36489047053ac451ddad9c88017b0d0fc6b8e5d4c0
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2500M
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Preserve R35, R37 and R40 source-pinned patches
        run: |
          set -euo pipefail
          test "$(readlink AGENTS.md)" = .claude/CLAUDE.md
          python3 -m py_compile .github/ts-lab-r35/apply_metric_drop.py
          cp .github/ts-lab-r35/apply_metric_drop.py "$RUNNER_TEMP/r35-patch.py"
          python3 -m py_compile .github/ts-lab-r37/apply_injective_projection.py
          cp .github/ts-lab-r37/apply_injective_projection.py "$RUNNER_TEMP/r37-patch.py"
          python3 -m py_compile .github/ts-lab-r40/apply_cumulative.py
          cp .github/ts-lab-r40/apply_cumulative.py "$RUNNER_TEMP/r40-patch.py"
          available_bytes="$(df -B1 --output=avail . | tail -n 1 | tr -d ' ')"
          if [ "$available_bytes" -lt 59055800320 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache /usr/local/share/powershell || true
          fi
      - name: Checkout pinned unmodified source
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/ClickHouse/ClickHouse.git
          git fetch --no-tags --depth=1 upstream "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git submodule sync --recursive
      - name: Restore pinned submodule metadata
        uses: actions/cache/restore@v4
        with:
          path: .git/modules
          key: tslab-submodule-metadata-52529f0c711566d696917678bf15e7068772fdde-v2
      - name: Populate exact submodules
        run: |
          set -euo pipefail
          git submodule init
          git config --file .gitmodules --get-regexp '.*path' | sed 's/[^ ]* //' |
            xargs -r -n 1 -P 12 git submodule update --depth=1 --single-branch --
          git submodule status --recursive > "$RUNNER_TEMP/pinned-submodules.txt"
          if grep -E '^[+-U]' "$RUNNER_TEMP/pinned-submodules.txt"; then exit 1; fi
      - name: Apply exact R35, R37, R38 cumulative compiler changes
        run: |
          set -euo pipefail
          git diff --exit-code
          mkdir -p evidence
          python3 "$RUNNER_TEMP/r35-patch.py" --apply --out evidence/R35.patch | tee evidence/r35-patch-identity.txt
          python3 "$RUNNER_TEMP/r37-patch.py" --apply --out evidence/R37.patch | tee evidence/r37-patch-identity.txt
          python3 "$RUNNER_TEMP/r40-patch.py" --apply --out evidence/R40.patch | tee evidence/r40-patch-identity.txt
          git diff --check
          test "$(git diff --name-only)" = src/Storages/TimeSeries/PrometheusQueryToSQL/applyFunctionOverRange.cpp
          git diff > evidence/git.patch
          sha256sum evidence/git.patch > evidence/git-patch.sha256
          cp src/Storages/TimeSeries/PrometheusQueryToSQL/applyFunctionOverRange.cpp evidence/candidate-source.cpp
      - name: Install pinned toolchain
        run: |
          set -euo pipefail
          curl -fL --retry 5 "https://www.kernel.org/pub/tools/llvm/files/llvm-${LLVM_VERSION}-x86_64.tar.xz" -o "$RUNNER_TEMP/llvm.tar.xz"
          echo "$LLVM_SHA256  $RUNNER_TEMP/llvm.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/llvm"
          tar -xf "$RUNNER_TEMP/llvm.tar.xz" -C "$RUNNER_TEMP/llvm" --strip-components=1
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ccache nasm
          mkdir -p "$CCACHE_DIR"
          "$RUNNER_TEMP/llvm/bin/clang++" --version > evidence/compiler.txt
      - name: Restore source-matched R37 ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: tslab-ccache-Linux-52529f0c711566d696917678bf15e7068772fdde-r37-injective-projection-o2-41789987661
          restore-keys: |
            tslab-ccache-Linux-52529f0c711566d696917678bf15e7068772fdde-r37-injective-projection-o2-
            tslab-ccache-Linux-52529f0c711566d696917678bf15e7068772fdde-r35-metric-drop-o2-
            tslab-ccache-Linux-52529f0c711566d696917678bf15e7068772fdde-r29-stock-o2-jemalloc-
            tslab-ccache-Linux-52529f0c711566d696917678bf15e7068772fdde-
      - name: Configure source-matched O2 and jemalloc
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/llvm/bin:$PATH"
          cmake -S . -B build-lab -G Ninja \
            -DLINKER_NAME="$RUNNER_TEMP/llvm/bin/ld.lld" \
            -DCMAKE_BUILD_TYPE=Release \
            '-DCMAKE_C_FLAGS_RELEASE=-O2 -DNDEBUG -g0' \
            '-DCMAKE_CXX_FLAGS_RELEASE=-O2 -DNDEBUG -g0' \
            -DCOMPILER_CACHE=ccache \
            -DCMAKE_C_COMPILER="$RUNNER_TEMP/llvm/bin/clang" \
            -DCMAKE_CXX_COMPILER="$RUNNER_TEMP/llvm/bin/clang++" \
            -DCMAKE_LINKER="$RUNNER_TEMP/llvm/bin/ld.lld" \
            -DENABLE_LIBRARIES=OFF -DENABLE_JEMALLOC=ON \
            -DENABLE_ANTLR4_CPP_RUNTIME=ON -DENABLE_ANTLR4_GRAMMARS=ON \
            -DENABLE_TESTS=OFF -DENABLE_BENCHMARKS=OFF -DENABLE_RUST=OFF \
            -DENABLE_CUDA=OFF -DENABLE_ARROW=OFF -DENABLE_ORC=OFF \
            -DENABLE_HDFS=OFF -DENABLE_ISAL_LIBRARY=OFF -DENABLE_GPU=OFF \
            -DENABLE_EXAMPLES=OFF -DENABLE_SUBSTRAIT=OFF -DCLICKHOUSE_OFFICIAL_BUILD=OFF
      - name: Compile one candidate executable
        run: |
          set -euo pipefail
          /usr/bin/time -v -o evidence/compile-time.txt ninja -C build-lab -j2 clickhouse > evidence/build.log 2>&1 || { tail -110 evidence/build.log; exit 1; }
          tail -28 evidence/build.log
          ccache --show-stats > evidence/ccache.txt
          build-lab/programs/clickhouse --version
      - name: Verify exact source and flags
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check
          git diff > evidence/git-current.patch
          cmp evidence/git.patch evidence/git-current.patch
          sha256sum -c evidence/git-patch.sha256
          grep -E '^ENABLE_JEMALLOC(:[^=]*)?=ON$' build-lab/CMakeCache.txt
          grep -E '^CMAKE_CXX_FLAGS_RELEASE(:[^=]*)?=.*-O2' build-lab/CMakeCache.txt
          grep -E '^(ENABLE_JEMALLOC|CMAKE_BUILD_TYPE|CMAKE_CXX_FLAGS_RELEASE)' build-lab/CMakeCache.txt > evidence/cmake-options.txt
          build-lab/programs/clickhouse local -q 'SELECT 1' | grep -x 1
      - name: Package candidate
        run: |
          set -euo pipefail
          mkdir -p output
          cp build-lab/programs/clickhouse output/clickhouse
          chmod +x output/clickhouse
          printf 'source=%s\nfork=%s\nllvm=%s\noptimization=O2 USE_JEMALLOC=1 R35/R38 by-and-without deferral plus R37 root/other injective projection\n' "$SOURCE_SHA" "$GITHUB_SHA" "$LLVM_VERSION" > output/BUILD_INFO.txt
          (cd output && sha256sum clickhouse > SHA256SUMS)
          tar -C output -cf - clickhouse SHA256SUMS BUILD_INFO.txt | zstd -T2 -10 -o output/clickhouse-r40-cumulative-compiler-o2.tar.zst
          (cd output && sha256sum clickhouse-r40-cumulative-compiler-o2.tar.zst > ARCHIVE_SHA256SUMS)
      - name: Upload cumulative binary and R35/R37/R40 exact patches
        uses: actions/upload-artifact@v4
        with:
          name: tslab-r40-cumulative-compiler-o2-binary-${{ github.sha }}
          path: |
            output/clickhouse-r40-cumulative-compiler-o2.tar.zst
            output/ARCHIVE_SHA256SUMS
            output/BUILD_INFO.txt
            evidence/
          compression-level: 0
          retention-days: 45
          if-no-files-found: error
      - name: Preserve partial ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: tslab-ccache-${{ runner.os }}-${{ env.SOURCE_SHA }}-r40-cumulative-compiler-o2-${{ github.run_id }}
