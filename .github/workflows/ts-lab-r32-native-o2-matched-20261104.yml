name: R32 full native one-bucket O2 matched ABBA
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tslab-r32-native-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: moleus/ClickHouse
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate harness and checkout
        run: |
          set -euo pipefail
          test "$(readlink AGENTS.md)" = ".claude/CLAUDE.md"
          python3 -m py_compile .github/ts-lab-r32/bench_native_onebucket_o2.py
          mkdir -p evidence/r32-native
          git rev-parse HEAD > evidence/r32-native/workflow-commit.txt
      - name: Retrieve pinned R29 stock binary
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r32-stock-art" "$RUNNER_TEMP/r32-stock-bin"
          gh run download 41685467438 -R "$REPO" --pattern 'tslab-r29-stock-o2-jemalloc-binary-*' -D "$RUNNER_TEMP/r32-stock-art"
          archive="$(find "$RUNNER_TEMP/r32-stock-art" -name 'clickhouse-stock-clickhouse-o2-jemalloc-linux-amd64.tar.zst' -type f -print -quit)"
          test -s "$archive"
          (cd "$(dirname "$archive")" && sha256sum -c ARCHIVE_SHA256SUMS)
          zstd -dc "$archive" | tar -xf - -C "$RUNNER_TEMP/r32-stock-bin"
          (cd "$RUNNER_TEMP/r32-stock-bin" && sha256sum -c SHA256SUMS)
          test "$(sha256sum "$RUNNER_TEMP/r32-stock-bin/clickhouse" | awk '{print $1}')" = 5d629ddfda91919402fdf8475ec3da9fe718d48ef386bc51be677264df6dc9ef
          grep -Fxq 'source=52529f0c711566d696917678bf15e7068772fdde' "$RUNNER_TEMP/r32-stock-bin/BUILD_INFO.txt"
          grep -Fxq 'optimization=O2 USE_JEMALLOC=1 unmodified stock source no lab patches' "$RUNNER_TEMP/r32-stock-bin/BUILD_INFO.txt"
      - name: Retrieve source-matched R32 candidate binary
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r32-candidate-art" "$RUNNER_TEMP/r32-candidate-bin"
          gh run download 41728002199 -R "$REPO" --pattern 'tslab-r32-onebucket-o2-jemalloc-binary-*' -D "$RUNNER_TEMP/r32-candidate-art"
          archive="$(find "$RUNNER_TEMP/r32-candidate-art" -name 'clickhouse-r32-onebucket-o2-jemalloc-linux-amd64.tar.zst' -type f -print -quit)"
          test -s "$archive"
          (cd "$(dirname "$archive")" && sha256sum -c ARCHIVE_SHA256SUMS)
          zstd -dc "$archive" | tar -xf - -C "$RUNNER_TEMP/r32-candidate-bin"
          (cd "$RUNNER_TEMP/r32-candidate-bin" && sha256sum -c SHA256SUMS)
          grep -Fxq 'source=52529f0c711566d696917678bf15e7068772fdde' "$RUNNER_TEMP/r32-candidate-bin/BUILD_INFO.txt"
          grep -Fxq 'optimization=O2 USE_JEMALLOC=1 R32 single-bucket finalizer only' "$RUNNER_TEMP/r32-candidate-bin/BUILD_INFO.txt"
          sha256sum "$RUNNER_TEMP/r32-stock-bin/clickhouse" "$RUNNER_TEMP/r32-candidate-bin/clickhouse" | tee evidence/r32-native/binaries.sha256
      - name: Native PromQL matched fresh-process ABBA
        run: |
          set -euo pipefail
          python3 -u .github/ts-lab-r32/bench_native_onebucket_o2.py \
            --stock "$RUNNER_TEMP/r32-stock-bin/clickhouse" \
            --candidate "$RUNNER_TEMP/r32-candidate-bin/clickhouse" \
            --work "$RUNNER_TEMP/r32-work" --out evidence/r32-native \
            --series 4096 --updates 1 | tee evidence/r32-run.log
      - name: Preserve evidence including failed phases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tslab-r32-native-o2-abba-evidence
          path: |
            evidence/r32-native/
            evidence/r32-run.log
          if-no-files-found: warn
          retention-days: 45
