name: R28 ClickHouse workload query admission smoke

on:
  push:
    branches: [lab/ts-cbo-adaptive-20261103]
    paths: ['.github/workflows/ts-lab-r28-admission-smoke-20261103.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tslab-r28-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: moleus/ClickHouse
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source and script
        run: |
          set -euo pipefail
          test "$(readlink AGENTS.md)" = .claude/CLAUDE.md
          test "$(git ls-files -s AGENTS.md | awk '{print $1}')" = 120000
          python3 -m py_compile .github/ts-lab-r28/admission_smoke.py
          mkdir -p evidence/r28
          git rev-parse HEAD > evidence/r28/commit.txt
          nproc > evidence/r28/cores.txt
          grep -m1 '^model name' /proc/cpuinfo > evidence/r28/cpu.txt || true
      - name: Restore source-matched verified stock O1 executable
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ch-art" "$RUNNER_TEMP/ch-bin"
          gh run download 41596421285 -R "$REPO" --pattern 'tslab-stock-clickhouse-o1-binary-*' -D "$RUNNER_TEMP/ch-art"
          archive="$(find "$RUNNER_TEMP/ch-art" -name 'clickhouse-stock-clickhouse-o1-linux-amd64.tar.zst' -type f -print -quit)"
          test -s "$archive"
          (cd "$(dirname "$archive")" && sha256sum -c ARCHIVE_SHA256SUMS)
          zstd -dc "$archive" | tar -xf - -C "$RUNNER_TEMP/ch-bin"
          (cd "$RUNNER_TEMP/ch-bin" && sha256sum -c SHA256SUMS)
          test "$(sha256sum "$RUNNER_TEMP/ch-bin/clickhouse" | awk '{print $1}')" = f0a2fa1f814c58853f43423705cac10ab9df3bfe5887e27ebe9620ba7cb9660e
          test "$(grep '^source=' "$RUNNER_TEMP/ch-bin/BUILD_INFO.txt")" = 'source=52529f0c711566d696917678bf15e7068772fdde'
          cp "$RUNNER_TEMP/ch-bin/BUILD_INFO.txt" evidence/r28/
          sha256sum "$RUNNER_TEMP/ch-bin/clickhouse" > evidence/r28/binary-sha256.txt
      - name: Launch isolated ClickHouse with workload scheduler
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ch/data" "$RUNNER_TEMP/ch/tmp" "$RUNNER_TEMP/ch/userfiles"
          cat > "$RUNNER_TEMP/config.xml" <<EOF
          <clickhouse>
            <logger><level>warning</level><console>true</console></logger>
            <listen_host>127.0.0.1</listen_host>
            <http_port>18191</http_port><tcp_port>19000</tcp_port>
            <path>$RUNNER_TEMP/ch/data/</path>
            <tmp_path>$RUNNER_TEMP/ch/tmp/</tmp_path>
            <user_files_path>$RUNNER_TEMP/ch/userfiles/</user_files_path>
            <max_server_memory_usage>3200000000</max_server_memory_usage>
            <users><default><password></password><networks><ip>127.0.0.1</ip></networks><profile>default</profile><quota>default</quota></default></users>
            <profiles><default><log_queries>1</log_queries></default></profiles>
            <quotas><default><interval><duration>3600</duration></interval></default></quotas>
            <default_profile>default</default_profile><default_database>default</default_database>
          </clickhouse>
          EOF
          "$RUNNER_TEMP/ch-bin/clickhouse" server --config-file="$RUNNER_TEMP/config.xml" >evidence/r28/server.log 2>&1 &
          echo "$!" > evidence/r28/pid.txt
          for i in $(seq 1 90); do
            if ! kill -0 "$(cat evidence/r28/pid.txt)" 2>/dev/null; then
              tail -80 evidence/r28/server.log
              exit 1
            fi
            if curl -fsS --max-time 2 http://127.0.0.1:18191/ping >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18191/ping
      - name: Run bounded query-slot queue smoke
        run: |
          set -euo pipefail
          python3 -u .github/ts-lab-r28/admission_smoke.py | tee evidence/r28/smoke.log
      - name: Preserve result and error log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tslab-r28-admission-smoke-${{ github.run_id }}
          path: evidence/r28/
          retention-days: 45
          compression-level: 1
