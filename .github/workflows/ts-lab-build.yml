name: TimeSeries lab Linux amd64

on:
  workflow_dispatch:
  push:
    branches: [lab/timeseries-fastpath-ci]
    paths:
      - '.github/workflows/ts-lab-build.yml'
      - '.github/ts-lab-patches/**'
      - '.github/ts-lab-scripts/**'

permissions:
  contents: write

concurrency:
  group: ts-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clickhouse:
    runs-on: ${{ vars.CH_BUILD_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      SOURCE_SHA: 52529f0c711566d696917678bf15e7068772fdde
      LLVM_VERSION: 22.1.8
      LLVM_SHA256: 8d5d1e52a06e1c10e457fd36489047053ac451ddad9c88017b0d0fc6b8e5d4c0
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2500M
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Keep lab patch and tests
        run: |
          cp .github/ts-lab-patches/0001-fast-sum-rate-no-duplicate-grid.patch "${RUNNER_TEMP}/fastpath.patch"
          cp .github/ts-lab-scripts/validate_promql.py "${RUNNER_TEMP}/validate_promql.py"

      - name: Free disk and check capacity
        run: |
          df -h .
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache /usr/local/share/powershell || true
          df -h .

      - name: Checkout exact baseline and submodules
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/ClickHouse/ClickHouse.git
          git fetch --no-tags --depth=1 upstream "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1 --jobs 4
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          df -h .

      - name: Apply patch
        run: |
          set -euo pipefail
          git apply --check "${RUNNER_TEMP}/fastpath.patch"
          git apply "${RUNNER_TEMP}/fastpath.patch"
          git diff --check
          git diff --stat

      - name: Install pinned LLVM
        run: |
          set -euo pipefail
          curl -fL --retry 5 "https://www.kernel.org/pub/tools/llvm/files/llvm-${LLVM_VERSION}-x86_64.tar.xz" -o "${RUNNER_TEMP}/llvm.tar.xz"
          echo "${LLVM_SHA256}  ${RUNNER_TEMP}/llvm.tar.xz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/llvm"
          tar -xf "${RUNNER_TEMP}/llvm.tar.xz" -C "${RUNNER_TEMP}/llvm" --strip-components=1
          "${RUNNER_TEMP}/llvm/bin/clang++" --version

      - name: Install ccache and NASM
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ccache nasm
          ccache --version
          nasm --version
          mkdir -p "$CCACHE_DIR"

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: tslab-ccache-${{ runner.os }}-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          restore-keys: |
            tslab-ccache-${{ runner.os }}-${{ env.SOURCE_SHA }}-

      - name: Configure ClickHouse
        run: |
          set -euo pipefail
          export PATH="${RUNNER_TEMP}/llvm/bin:${PATH}"
          command -v ld.lld
          ld.lld --version
          cmake -S . -B build-lab -G Ninja \
            -DLINKER_NAME="${RUNNER_TEMP}/llvm/bin/ld.lld" \
            -DCMAKE_BUILD_TYPE=Release \
            '-DCMAKE_C_FLAGS_RELEASE=-O1 -DNDEBUG -g0' \
            '-DCMAKE_CXX_FLAGS_RELEASE=-O1 -DNDEBUG -g0' \
            -DCOMPILER_CACHE=ccache \
            -DCMAKE_C_COMPILER="${RUNNER_TEMP}/llvm/bin/clang" \
            -DCMAKE_CXX_COMPILER="${RUNNER_TEMP}/llvm/bin/clang++" \
            -DCMAKE_LINKER="${RUNNER_TEMP}/llvm/bin/ld.lld" \
            -DENABLE_TESTS=OFF \
            -DENABLE_BENCHMARKS=OFF \
            -DENABLE_RUST=OFF \
            -DENABLE_CUDA=OFF \
            -DENABLE_ARROW=OFF \
            -DENABLE_ORC=OFF \
            -DENABLE_HDFS=OFF \
            -DENABLE_ISAL_LIBRARY=OFF \
            -DENABLE_GPU=OFF \
            -DENABLE_EXAMPLES=OFF \
            -DENABLE_SUBSTRAIT=OFF \
            -DCLICKHOUSE_OFFICIAL_BUILD=OFF
          df -h .

      - name: Compile one executable
        run: |
          set -euo pipefail
          time ninja -C build-lab -j2 clickhouse
          ccache --show-stats
          test -s build-lab/programs/clickhouse
          build-lab/programs/clickhouse --version

      - name: Smoke tests
        run: |
          set -euo pipefail
          build-lab/programs/clickhouse local -q 'SELECT 1' | grep -x 1
          build-lab/programs/clickhouse local -q 'SELECT version()'
          build-lab/programs/clickhouse local --allow_experimental_time_series_table=1 -q 'SELECT 1' | grep -x 1
          python3 "${RUNNER_TEMP}/validate_promql.py" build-lab/programs/clickhouse

      - name: Package lab binary
        run: |
          set -euo pipefail
          mkdir -p output
          cp build-lab/programs/clickhouse output/clickhouse
          chmod +x output/clickhouse
          printf 'source=%s\nfork=%s\nllvm=%s\noptimization=O1\n' "$SOURCE_SHA" "$GITHUB_SHA" "$LLVM_VERSION" > output/BUILD_INFO.txt
          (cd output && sha256sum clickhouse > SHA256SUMS)
          tar -C output -cf - clickhouse SHA256SUMS BUILD_INFO.txt | zstd -T2 -10 -o output/clickhouse-linux-amd64.tar.zst
          (cd output && sha256sum clickhouse-linux-amd64.tar.zst > ARCHIVE_SHA256SUMS)

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: tslab-clickhouse-amd64-${{ github.sha }}
          path: |
            output/clickhouse-linux-amd64.tar.zst
            output/ARCHIVE_SHA256SUMS
            output/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish lab prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="tslab-${GITHUB_SHA:0:12}"
          gh release create "$tag" output/clickhouse-linux-amd64.tar.zst output/ARCHIVE_SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" --target "$GITHUB_SHA" \
            --title "TimeSeries lab ${GITHUB_SHA:0:12}" \
            --notes "Experimental -O1 ClickHouse build from pinned source $SOURCE_SHA; five local PromQL regression cases passed. Not production verified." \
            --prerelease --latest=false
