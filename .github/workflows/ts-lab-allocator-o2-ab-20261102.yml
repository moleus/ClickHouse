name: TimeSeries matched O2 jemalloc versus system allocator 1.33m VM reference
on:
  push:
    branches: [lab/timeseries-fastpath-ci]
    paths: ['.github/workflows/ts-lab-allocator-o2-ab-20261102.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: tslab-allocator-o2-ab-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: moleus/ClickHouse
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download SHA256 verified baseline binary without recompiling
        run: |
          set -euo pipefail
          mkdir -p evidence "$RUNNER_TEMP/ch-art" "$RUNNER_TEMP/ch-bin"
          gh run download 41301314345 -R "$REPO" --pattern 'tslab-clickhouse-amd64-*' -D "$RUNNER_TEMP/ch-art"
          archive="$(find "$RUNNER_TEMP/ch-art" -name 'clickhouse-linux-amd64.tar.zst' -type f -print -quit)"
          test -s "$archive"
          (cd "$(dirname "$archive")" && sha256sum -c ARCHIVE_SHA256SUMS) | tee evidence/ch-archive-hash.txt
          zstd -dc "$archive" | tar -xf - -C "$RUNNER_TEMP/ch-bin"
          (cd "$RUNNER_TEMP/ch-bin" && sha256sum -c SHA256SUMS) | tee evidence/ch-binary-hash.txt
          chmod +x "$RUNNER_TEMP/ch-bin/clickhouse"
          "$RUNNER_TEMP/ch-bin/clickhouse" --version | tee evidence/ch-version.txt

      - name: Start isolated ClickHouse and create v11 Float64 fixture
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ch/data" "$RUNNER_TEMP/ch/tmp" "$RUNNER_TEMP/ch/userfiles"
          cat > "$RUNNER_TEMP/config.xml" <<EOF
          <clickhouse>
            <logger><level>warning</level><console>true</console></logger>
            <listen_host>127.0.0.1</listen_host><http_port>18191</http_port><tcp_port>19000</tcp_port>
            <path>$RUNNER_TEMP/ch/data/</path><tmp_path>$RUNNER_TEMP/ch/tmp/</tmp_path>
            <user_files_path>$RUNNER_TEMP/ch/userfiles/</user_files_path>
            <max_server_memory_usage>5000000000</max_server_memory_usage>
            <users><default><password></password><networks><ip>127.0.0.1</ip></networks><profile>default</profile><quota>default</quota></default></users>
            <profiles><default><allow_experimental_time_series_table>1</allow_experimental_time_series_table><enable_time_series_aggregate_functions>1</enable_time_series_aggregate_functions><log_queries>1</log_queries><max_memory_usage>4000000000</max_memory_usage></default></profiles>
            <quotas><default><interval><duration>3600</duration></interval></default></quotas>
            <query_log><database>system</database><table>query_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></query_log>
            <trace_log><database>system</database><table>trace_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></trace_log>
            <processors_profile_log><database>system</database><table>processors_profile_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></processors_profile_log>
            <query_thread_log><database>system</database><table>query_thread_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></query_thread_log>
            <default_profile>default</default_profile><default_database>default</default_database>
          </clickhouse>
          EOF
          "$RUNNER_TEMP/ch-bin/clickhouse" server --config-file="$RUNNER_TEMP/config.xml" >evidence/ch-server.log 2>&1 &
          echo "$!" > "$RUNNER_TEMP/ch.pid"
          for i in $(seq 1 90); do
            if curl -fsS --max-time 1 http://127.0.0.1:18191/ping >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS -X POST --data-binary 'CREATE TABLE precision_ts ENGINE=TimeSeries SETTINGS recent_samples_ttl_seconds=0'             'http://127.0.0.1:18191/?allow_experimental_time_series_table=1' >evidence/create.txt
          python3 - <<'PY'
          import datetime,json,pathlib,os
          start=int(datetime.datetime(2026,11,1,tzinfo=datetime.timezone.utc).timestamp())
          pathlib.Path('evidence/manifest.json').write_text(json.dumps({'start':start,'end':start+86400},indent=2))
          series={
              'cancel_1e18':[1e18,2.0,3.0,5.0,-1e18],
              'cancel_1e16':[1e16,1.0,-1e16],
              'cancel_micro':[1e18,1e-6,-1e18,1e-6],
              'ordinary':[1.0,2.0,3.0],
          }
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'precision.jsonl'
          with out.open('w') as f:
              for stage,values in series.items():
                  samples=[['2026-10-31 01:%02d:00.000'%i,v] for i,v in enumerate(values)]
                  f.write(json.dumps({'metric_name':'tslab_numeric_precision',
                                      'tags':{'stage':stage,'build':'single-'+stage},
                                      'samples':samples},separators=(',',':'))+'\n')
          print('NUMERIC_FIXTURE',json.dumps(series,sort_keys=True),flush=True)
          PY
          sha256sum "$RUNNER_TEMP/precision.jsonl" >evidence/fixture-sha256.txt
          curl -fsS --max-time 120 --data-binary "@$RUNNER_TEMP/precision.jsonl"             'http://127.0.0.1:18191/?allow_experimental_time_series_table=1&wait_end_of_query=1&query=INSERT%20INTO%20precision_ts%20(metric_name%2Ctags%2Csamples)%20FORMAT%20JSONEachRow'             >evidence/insert-response.txt
          curl -fsS --data-binary 'SELECT metric_name,count() FROM precision_ts GROUP BY metric_name FORMAT TSV'             http://127.0.0.1:18191/ | tee evidence/fixture-count.tsv

      - name: Generate SHA verified 14d 95k new Jenkins IDs daily in ClickHouse
        run: |
          set -euo pipefail
          python3 -m py_compile .github/ts-lab-bench/generate_95k_daily_churn_ts.py             .github/ts-lab-bench/import_95k_churn_to_vm.py             .github/ts-lab-bench/bench_95k_daily_vs_vm.py
          python3 .github/ts-lab-bench/generate_95k_daily_churn_ts.py             --manifest evidence/95k-manifest.json             --fixture "$RUNNER_TEMP/95k-churn.jsonl" | tee evidence/95k-ingest-ch.log
          sha256sum "$RUNNER_TEMP/95k-churn.jsonl" >evidence/95k-fixture.sha256

      - name: Download SHA256 verified O2 without jemalloc
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/selectorscalar-art" "$RUNNER_TEMP/selectorscalar-bin"
          gh run download 41467151457 -R "$REPO" \
            -n tslab-v4-filtered-kbn-o2-lab-binary-0dec1dbeca0586c3782bff457d6b6890a43723f4 \
            -D "$RUNNER_TEMP/selectorscalar-art"
          archive="$(find "$RUNNER_TEMP/selectorscalar-art" -type f -name "clickhouse-v4-filtered-kbn-o2-lab-linux-amd64.tar.zst" -print -quit)"
          test -s "$archive"
          (cd "$(dirname "$archive")" && sha256sum -c ARCHIVE_SHA256SUMS) | tee evidence/system-archive-hash.txt
          zstd -dc "$archive" | tar -xf - -C "$RUNNER_TEMP/selectorscalar-bin"
          (cd "$RUNNER_TEMP/selectorscalar-bin" && sha256sum -c SHA256SUMS) | tee evidence/system-binary-hash.txt
          chmod +x "$RUNNER_TEMP/selectorscalar-bin/clickhouse"
          cp "$RUNNER_TEMP/selectorscalar-bin/BUILD_INFO.txt" evidence/system-build-info.txt
          grep -q 'source=52529f0c711566d696917678bf15e7068772fdde' evidence/system-build-info.txt
          grep -q 'optimization=O2' evidence/system-build-info.txt
          "$RUNNER_TEMP/selectorscalar-bin/clickhouse" --version | tee evidence/system-version.txt

      - name: Download SHA256 verified O2 with jemalloc and same three patch blobs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/o2-art" "$RUNNER_TEMP/o2-bin"
          gh run download 41476488794 -R "$REPO" \
            -n tslab-v4-o2-jemalloc-lab-binary-53e3a95595fa73e0fd6c71982370cb396ff72236 \
            -D "$RUNNER_TEMP/o2-art"
          archive="$(find "$RUNNER_TEMP/o2-art" -type f -name "clickhouse-v4-o2-jemalloc-lab-linux-amd64.tar.zst" -print -quit)"
          test -s "$archive"
          (cd "$(dirname "$archive")" && sha256sum -c ARCHIVE_SHA256SUMS) | tee evidence/jemalloc-archive-hash.txt
          zstd -dc "$archive" | tar -xf - -C "$RUNNER_TEMP/o2-bin"
          (cd "$RUNNER_TEMP/o2-bin" && sha256sum -c SHA256SUMS) | tee evidence/jemalloc-binary-hash.txt
          chmod +x "$RUNNER_TEMP/o2-bin/clickhouse"
          cp "$RUNNER_TEMP/o2-bin/BUILD_INFO.txt" evidence/jemalloc-build-info.txt
          grep -q 'source=52529f0c711566d696917678bf15e7068772fdde' evidence/jemalloc-build-info.txt
          grep -q 'optimization=O2 + USE_JEMALLOC=1' evidence/jemalloc-build-info.txt
          "$RUNNER_TEMP/o2-bin/clickhouse" --version | tee evidence/jemalloc-version.txt
          printf 'both use same pinned LLVM 22.1.8, source and fastpath/selector/KBN patch blobs\n' > evidence/patch-identity.txt
          printf 'fastpath=d6cb5c99f2e760453d57c7506ddac94eb67ed24d\n' >> evidence/patch-identity.txt
          printf 'selector=21b5d7f6965730879775fd854fc7f72f636a1d66\n' >> evidence/patch-identity.txt
          printf 'kbn=3525b74582ac66d317bfec1fd500dfca60d6f903\n' >> evidence/patch-identity.txt

      - name: Controlled ClickHouse restart helper, preserving the same on-disk datasets
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ch-restart.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          binary="$1"
          phase="$2"
          parent="$(cat "$RUNNER_TEMP/ch.pid")"
          children="$(cat "/proc/$parent/task/$parent/children" 2>/dev/null || true)"
          for pid in $children "$parent"; do
            if [ -n "$pid" ]; then kill -TERM "$pid" 2>/dev/null || true; fi
          done
          # Do not restart just because a clickhouse watchdog has stopped:
          # wait for both the old HTTP listener and its actual process.
          for attempt in $(seq 1 100); do
            if ! curl -fsS --max-time 1 http://127.0.0.1:18191/ping >/dev/null 2>&1; then
              echo "BUCKET_PREVIOUS_SERVER_CLOSED phase=$phase attempt=$attempt"
              break
            fi
            sleep 1
          done
          if curl -fsS --max-time 1 http://127.0.0.1:18191/ping >/dev/null 2>&1; then
            echo 'Old ClickHouse still listening; refuse unsafe restart' >&2
            exit 1
          fi
          sleep 2
          "$binary" server --config-file="$RUNNER_TEMP/config.xml" >"evidence/ch-server-$phase.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/ch.pid"
          for attempt in $(seq 1 120); do
            if curl -fsS --max-time 1 http://127.0.0.1:18191/ping >/dev/null 2>&1; then
              echo "BUCKET_SERVER_STARTED phase=$phase attempt=$attempt"
              exit 0
            fi
            sleep 1
          done
          tail -110 "evidence/ch-server-$phase.log"
          exit 1
          SH
          chmod +x "$RUNNER_TEMP/ch-restart.sh"


      - name: Download pinned SHA256 verified VM and start isolated 6-month store
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vm-art" "$RUNNER_TEMP/vm-bin" "$RUNNER_TEMP/vm/data"
          gh run download 41288854734 -R "$REPO"             -n tslab-victoria-metrics-v1.134.0 -D "$RUNNER_TEMP/vm-art"
          (cd "$RUNNER_TEMP/vm-art" && sed 's#  output/#  #' SHA256SUMS | sha256sum -c -)             | tee evidence/vm-binary-hash.txt
          tar -xzf "$RUNNER_TEMP/vm-art/victoria-metrics-linux-amd64-v1.134.0.tar.gz"             -C "$RUNNER_TEMP/vm-bin"
          chmod +x "$RUNNER_TEMP/vm-bin/victoria-metrics-prod"
          "$RUNNER_TEMP/vm-bin/victoria-metrics-prod" --version 2>&1             | head -n 3 | tee evidence/vm-version.txt
          "$RUNNER_TEMP/vm-bin/victoria-metrics-prod"             -storageDataPath="$RUNNER_TEMP/vm/data"             -httpListenAddr=127.0.0.1:8430 -retentionPeriod=6             -search.maxUniqueTimeseries=2000000 -search.disableCache             >evidence/vm-server.log 2>&1 &
          echo "$!" > "$RUNNER_TEMP/vm.pid"
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:8430/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS --max-time 2 http://127.0.0.1:8430/health >evidence/vm-health.txt
          python3 -m py_compile .github/ts-lab-bench/import_dense_sparse_to_vm.py             .github/ts-lab-bench/bench_ch_vs_vm_dense_sparse.py

      - name: Import same 1.33m samples into VM without altering Float64 values
        run: |
          set -euo pipefail
          python3 .github/ts-lab-bench/import_95k_churn_to_vm.py             --fixture "$RUNNER_TEMP/95k-churn.jsonl"             --manifest evidence/95k-manifest.json             --output evidence/95k-vm-import.json | tee evidence/95k-vm-import.log

      - name: Test 4 selectors on matched O2 allocator binaries against VM
        run: |
          set -euo pipefail
          python3 -m py_compile .github/ts-lab-bench/bench_allocator_ab.py
          python3 .github/ts-lab-bench/bench_allocator_ab.py \
            --manifest evidence/95k-manifest.json \
            --system-bin "$RUNNER_TEMP/selectorscalar-bin/clickhouse" \
            --jemalloc-bin "$RUNNER_TEMP/o2-bin/clickhouse" \
            --restart-helper "$RUNNER_TEMP/ch-restart.sh" \
            --output evidence/allocator-ab.json | tee evidence/o1-o2-ab.log
          ps -eo pid,ppid,rss,comm > evidence/allocator-processes.tsv
          du -sb "$RUNNER_TEMP/ch/data" "$RUNNER_TEMP/vm/data" > evidence/allocator-storage.tsv

      - name: Preserve numerical proof and any diagnostic failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tslab-95k-stage-projection-paired-${{ github.run_id }}
          path: evidence/
          retention-days: 21
          compression-level: 1
