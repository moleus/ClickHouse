name: TimeSeries v2 fixed C++ scalar AVG A/B/A plus mixed-metric guard
on:
  push:
    branches: [lab/timeseries-fastpath-ci]
    paths: ['.github/workflows/ts-lab-selector-scalar-v2-fixed-aba-20261102.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: tslab-selector-scalar-v2-fixed-aba-20261102-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: moleus/ClickHouse
      CH_RUN: '41301314345'
      VM_RUN: '41288854734'
      DAYS: '3'
      BUILDS_PER_DAY: '2474'
      STAGE_VARIANTS: '1448'
      LIMIT_PROBE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Download verified baseline ClickHouse and VictoriaMetrics binaries
        run: |
          set -euo pipefail
          mkdir -p evidence "$RUNNER_TEMP/ch-art" "$RUNNER_TEMP/ch-bin" "$RUNNER_TEMP/vm-art" "$RUNNER_TEMP/vm-bin"
          gh run download "$CH_RUN" -R "$REPO" --pattern 'tslab-clickhouse-amd64-*' -D "$RUNNER_TEMP/ch-art"
          archive="$(find "$RUNNER_TEMP/ch-art" -type f -name 'clickhouse-linux-amd64.tar.zst' -print -quit)"
          test -s "$archive"
          (cd "$(dirname "$archive")" && sha256sum -c ARCHIVE_SHA256SUMS) | tee evidence/ch-archive-hash.txt
          zstd -dc "$archive" | tar -xf - -C "$RUNNER_TEMP/ch-bin"
          (cd "$RUNNER_TEMP/ch-bin" && sha256sum -c SHA256SUMS) | tee evidence/ch-binary-hash.txt
          chmod +x "$RUNNER_TEMP/ch-bin/clickhouse"
          "$RUNNER_TEMP/ch-bin/clickhouse" --version | tee evidence/ch-version.txt
          gh run download "$VM_RUN" -R "$REPO" -n tslab-victoria-metrics-v1.134.0 -D "$RUNNER_TEMP/vm-art"
          (cd "$RUNNER_TEMP/vm-art" && sed 's#  output/#  #' SHA256SUMS | sha256sum -c -) | tee evidence/vm-archive-hash.txt
          tar -xzf "$RUNNER_TEMP/vm-art/victoria-metrics-linux-amd64-v1.134.0.tar.gz" -C "$RUNNER_TEMP/vm-bin"
          chmod +x "$RUNNER_TEMP/vm-bin/victoria-metrics-prod"
          "$RUNNER_TEMP/vm-bin/victoria-metrics-prod" --version 2>&1 | head -n 4 | tee evidence/vm-version.txt

      - name: Launch query-enabled loopback engines with explicit VM unique-series limit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ch/data" "$RUNNER_TEMP/ch/tmp" "$RUNNER_TEMP/ch/userfiles" "$RUNNER_TEMP/vm/data"
          cat > "$RUNNER_TEMP/config.xml" <<EOF
          <clickhouse>
            <logger><level>warning</level><console>true</console></logger>
            <listen_host>127.0.0.1</listen_host><http_port>18191</http_port><tcp_port>19000</tcp_port>
            <path>$RUNNER_TEMP/ch/data/</path><tmp_path>$RUNNER_TEMP/ch/tmp/</tmp_path>
            <user_files_path>$RUNNER_TEMP/ch/userfiles/</user_files_path>
            <max_server_memory_usage>6000000000</max_server_memory_usage>
            <users><default><password></password><networks><ip>127.0.0.1</ip></networks><profile>default</profile><quota>default</quota></default></users>
            <profiles><default><allow_experimental_time_series_table>1</allow_experimental_time_series_table><enable_time_series_aggregate_functions>1</enable_time_series_aggregate_functions><log_queries>1</log_queries><max_memory_usage>3000000000</max_memory_usage></default></profiles>
            <quotas><default><interval><duration>3600</duration></interval></default></quotas>
            <query_log><database>system</database><table>query_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></query_log>
            <default_profile>default</default_profile><default_database>default</default_database>
          </clickhouse>
          EOF
          "$RUNNER_TEMP/ch-bin/clickhouse" server --config-file="$RUNNER_TEMP/config.xml" >evidence/ch-server.log 2>&1 &
          echo "$!" > "$RUNNER_TEMP/ch.pid"
          "$RUNNER_TEMP/vm-bin/victoria-metrics-prod" -storageDataPath="$RUNNER_TEMP/vm/data" \
            -retentionPeriod=4w -httpListenAddr=127.0.0.1:8430 -search.disableCache \
            -search.maxUniqueTimeseries=1000000 \
            >evidence/vm-server.log 2>&1 &
          echo "$!" > "$RUNNER_TEMP/vm.pid"
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:18191/ping >/dev/null 2>&1 && \
               curl -fsS --max-time 2 http://127.0.0.1:8430/health >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          tail -100 evidence/ch-server.log evidence/vm-server.log
          exit 1

      - name: Create TimeSeries and event-native MergeTree data layouts
        run: |
          set -euo pipefail
          curl -fsS -X POST --data-binary \
            "CREATE TABLE jenkins_ts ENGINE=TimeSeries SETTINGS recent_samples_ttl_seconds=0,tags_deduplication_cache_size_bytes=33554432,tags_to_columns={'stage':'stage','branch':'branch','project':'project'}" \
            'http://127.0.0.1:18191/?allow_experimental_time_series_table=1' >evidence/ts-create.txt
          curl -fsS -X POST --data-binary \
            "CREATE TABLE jenkins_events (
               ts DateTime64(3, 'UTC'), stage LowCardinality(String), branch LowCardinality(String),
               build String, jenkins_job LowCardinality(String), project LowCardinality(String),
               app LowCardinality(String), result LowCardinality(String), duration Float64
             ) ENGINE=MergeTree PARTITION BY toYYYYMM(ts) ORDER BY (ts,stage,branch)" \
            http://127.0.0.1:18191/ >evidence/events-create.txt
          python3 .github/ts-lab-bench/gen_jenkins_sparse.py \
            --output "$RUNNER_TEMP/jenkins-batches" --init \
            --days "$DAYS" --builds-per-day "$BUILDS_PER_DAY" \
            --stages-per-build 38 --stage-variants "$STAGE_VARIANTS" | tee evidence/manifest.log
          cp "$RUNNER_TEMP/jenkins-batches/manifest.json" evidence/manifest.json

      - name: Import identical event timestamps labels and values into three stores
        run: |
          set -euo pipefail
          printf 'day\tch_ts_seconds\tch_events_seconds\tvm_seconds\n' > evidence/ingest-latency.tsv
          : > evidence/input-sha256.tsv
          for day in $(seq 0 $((DAYS-1))); do
            python3 .github/ts-lab-bench/gen_jenkins_sparse.py \
              --output "$RUNNER_TEMP/jenkins-batches" --day "$day" | tee -a evidence/generator-batches.jsonl
            (cd "$RUNNER_TEMP/jenkins-batches" && sha256sum ch-batch.jsonl event-batch.jsonl vm-batch.prom) \
              | sed "s#^#$day #" >> evidence/input-sha256.tsv
            c1="$(curl -fsS --max-time 340 -w '%{time_total}' -o evidence/ts-insert-response.txt \
              --data-binary "@$RUNNER_TEMP/jenkins-batches/ch-batch.jsonl" \
              'http://127.0.0.1:18191/?allow_experimental_time_series_table=1&wait_end_of_query=1&query=INSERT%20INTO%20jenkins_ts%20(metric_name%2Ctags%2Csamples)%20FORMAT%20JSONEachRow')" || { tail -100 evidence/ch-server.log; exit 1; }
            c2="$(curl -fsS --max-time 340 -w '%{time_total}' -o evidence/events-insert-response.txt \
              --data-binary "@$RUNNER_TEMP/jenkins-batches/event-batch.jsonl" \
              'http://127.0.0.1:18191/?wait_end_of_query=1&query=INSERT%20INTO%20jenkins_events%20FORMAT%20JSONEachRow')" || { tail -100 evidence/ch-server.log; exit 1; }
            v1="$(curl -fsS --max-time 340 -w '%{time_total}' -o evidence/vm-insert-response.txt \
              --data-binary "@$RUNNER_TEMP/jenkins-batches/vm-batch.prom" \
              'http://127.0.0.1:8430/api/v1/import/prometheus')" || { tail -100 evidence/vm-server.log; exit 1; }
            printf '%s\t%s\t%s\t%s\n' "$day" "$c1" "$c2" "$v1" | tee -a evidence/ingest-latency.tsv
          done
          curl -fsS --data-binary 'SYSTEM FLUSH LOGS' http://127.0.0.1:18191/ >/dev/null
          python3 - <<'PY'
          import json,os,urllib.request
          m=json.load(open('evidence/manifest.json'))
          def sql(q):
              with urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:18191/',data=q.encode()),timeout=180) as r:return r.read().decode().strip()
          name=sql("SELECT name FROM system.tables WHERE database='default' AND startsWith(name,'.inner_id.samples.') FORMAT TSVRaw")
          assert len(name.splitlines())==1,name
          ts=int(sql("SELECT sum(length(samples)) FROM default.`"+name+"`"))
          ev=int(sql("SELECT count() FROM jenkins_events"))
          assert ts==ev==m['total_samples'],(ts,ev,m['total_samples'])
          print('JENKINS_INGEST_VERIFIED',json.dumps({'ts':ts,'events':ev,'expected':m['total_samples']}))
          json.dump({'ts':ts,'events':ev,'expected':m['total_samples']},open('evidence/ingest-check.json','w'))
          PY

      - name: Wait until every imported VM day is visible to range queries
        run: |
          set -euo pipefail
          python3 .github/ts-lab-bench/wait_jenkins_vm_visible.py \
            --manifest evidence/manifest.json --output evidence/vm-ingest-readiness.json \
            --attempts 90 --sleep 2 | tee evidence/vm-ingest-readiness.log

      - name: Create and ingest regular dense metrics, 20000 series x 120 samples
        run: |
          set -euo pipefail
          python3 .github/ts-lab-bench/generate.py \
            --outdir "$RUNNER_TEMP/dense" --series 20000 --points 120 --step 60 \
            | tee evidence/dense-manifest.log
          cp "$RUNNER_TEMP/dense/manifest.json" evidence/dense-manifest.json
          (cd "$RUNNER_TEMP/dense" && sha256sum vm-import.prom ch-import.jsonl) > evidence/dense-input-sha256.txt
          curl -fsS -X POST --data-binary \
            'CREATE TABLE dense_ts ENGINE=TimeSeries SETTINGS recent_samples_ttl_seconds=0' \
            'http://127.0.0.1:18191/?allow_experimental_time_series_table=1' >evidence/dense-create.txt
          curl -fsS --max-time 350 -w 'CH_DENSE_INGEST_SECONDS=%{time_total}\n' \
            --data-binary "@$RUNNER_TEMP/dense/ch-import.jsonl" \
            'http://127.0.0.1:18191/?allow_experimental_time_series_table=1&wait_end_of_query=1&query=INSERT%20INTO%20dense_ts%20(metric_name%2Ctags%2Csamples)%20FORMAT%20JSONEachRow' \
            | tee evidence/dense-ch-ingest.log
          curl -fsS --max-time 350 -w 'VM_DENSE_INGEST_SECONDS=%{time_total}\n' \
            --data-binary "@$RUNNER_TEMP/dense/vm-import.prom" \
            'http://127.0.0.1:8430/api/v1/import/prometheus' \
            | tee evidence/dense-vm-ingest.log
          python3 - <<'PY'
          import json,urllib.parse,urllib.request,time
          m=json.load(open('evidence/dense-manifest.json'))
          def sql(q):
              u=urllib.request.Request('http://127.0.0.1:18191/',data=q.encode())
              with urllib.request.urlopen(u,timeout=300) as r:return r.read().decode().strip()
          names=sql("SELECT name FROM system.tables WHERE database='default' AND startsWith(name,'.inner_id.samples.') FORMAT TSVRaw").splitlines()
          counts=sorted(int(sql("SELECT sum(length(samples)) FROM default.`"+n+"`")) for n in names)
          assert counts==sorted([m['samples_total'],282036]),('unexpected inner samples',counts)
          url='http://127.0.0.1:8430/api/v1/query?'+urllib.parse.urlencode({
              'query':'count(bench_metric)','time':m['end_epoch'],'nocache':1})
          for attempt in range(90):
              with urllib.request.urlopen(url,timeout=200) as resp: data=json.load(resp)
              result=data.get('data',{}).get('result',[])
              visible=int(float(result[0]['value'][1])) if result else 0
              print('BUCKET_DENSE_VM_VISIBLE',attempt+1,visible,flush=True)
              if visible==m['series']:
                  break
              time.sleep(2)
          else:raise AssertionError(('VM dense import incomplete',visible,m['series']))
          print('BUCKET_DENSE_INGEST_VERIFIED',json.dumps({
              'ts_samples_counts':counts,'series':m['series'],'samples':m['samples_total'],
              'vm_series_visible':visible}),flush=True)
          PY

      - name: Insert tiny metric through the proven JSONEachRow writer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          base=pathlib.Path(os.environ['RUNNER_TEMP'])/'jenkins-batches'
          target=base/'small-metric-batch.jsonl'
          with (base/'ch-batch.jsonl').open() as source,target.open('w') as out:
              for n in range(210):
                  record=json.loads(next(source))
                  record['metric_name']='lab_small_metric'
                  out.write(json.dumps(record,sort_keys=True,separators=(',',':'))+'\n')
          print('MIXED_METRIC_INPUT',target,210,flush=True)
          PY
          sha256sum "$RUNNER_TEMP/jenkins-batches/small-metric-batch.jsonl" > evidence/mixed-metric-input-sha256.txt
          curl -fsS --max-time 350 -w 'MIXED_METRIC_INSERT_SECONDS=%{time_total}\n' \
            --data-binary "@$RUNNER_TEMP/jenkins-batches/small-metric-batch.jsonl" \
            'http://127.0.0.1:18191/?allow_experimental_time_series_table=1&wait_end_of_query=1&query=INSERT%20INTO%20jenkins_ts%20(metric_name%2Ctags%2Csamples)%20FORMAT%20JSONEachRow' \
            | tee evidence/mixed-metric-insert.log
          curl -fsS --data-binary "SELECT metric_name,count() AS series FROM jenkins_ts WHERE metric_name='lab_small_metric' GROUP BY metric_name FORMAT TSV" \
            'http://127.0.0.1:18191/?allow_experimental_time_series_table=1' \
            | tee evidence/mixed-metric-counts.tsv
          awk '$1=="lab_small_metric" && $2==210 {ok=1} END {exit !ok}' evidence/mixed-metric-counts.tsv

      - name: Download verified guarded scalar AVG C++ binary after independent build
        run: |
          set -euo pipefail
          run_id=41431984680
          source_sha=342bf00a44d8f822815f1eca64a79bc2175a0304
          mkdir -p "$RUNNER_TEMP/selectorscalar-art" "$RUNNER_TEMP/selectorscalar-bin"
          success=0
          for attempt in $(seq 1 120); do
            if gh run download "$run_id" -R "$REPO" \
                 -n "tslab-selector-scalar-v2-fixed-binary-$source_sha" \
                 -D "$RUNNER_TEMP/selectorscalar-art" 2>/dev/null; then
              success=1
              echo "SELECTOR_SCALAR_BINARY_ARTIFACT run=$run_id attempts=$attempt"
              break
            fi
            conclusion="$(gh run view "$run_id" -R "$REPO" --json conclusion --jq .conclusion || true)"
            if [ "$conclusion" = failure ] || [ "$conclusion" = cancelled ]; then
              echo "Fused C++ binary did not build successfully ($conclusion)" >&2
              exit 1
            fi
            sleep 15
          done
          [ "$success" = 1 ] || { echo "Fused C++ artifact not found" >&2; exit 1; }
          archive="$(find "$RUNNER_TEMP/selectorscalar-art" -type f -name 'clickhouse-selector-scalar-v2-fixed-linux-amd64.tar.zst' -print -quit)"
          test -s "$archive"
          (cd "$(dirname "$archive")" && sha256sum -c ARCHIVE_SHA256SUMS) | tee evidence/selector-scalar-archive-hash.txt
          zstd -dc "$archive" | tar -xf - -C "$RUNNER_TEMP/selectorscalar-bin"
          (cd "$RUNNER_TEMP/selectorscalar-bin" && sha256sum -c SHA256SUMS) | tee evidence/selectorscalar-binary-hash.txt
          chmod +x "$RUNNER_TEMP/selectorscalar-bin/clickhouse"
          "$RUNNER_TEMP/selectorscalar-bin/clickhouse" --version | tee evidence/selector-scalar-version.txt
          cp "$RUNNER_TEMP/selectorscalar-bin/BUILD_INFO.txt" evidence/selector-scalar-build-info.txt

      - name: Controlled ClickHouse restart helper, preserving the same on-disk datasets
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ch-restart.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          binary="$1"
          phase="$2"
          parent="$(cat "$RUNNER_TEMP/ch.pid")"
          children="$(cat "/proc/$parent/task/$parent/children" 2>/dev/null || true)"
          for pid in $children "$parent"; do
            if [ -n "$pid" ]; then kill -TERM "$pid" 2>/dev/null || true; fi
          done
          # Do not restart just because a clickhouse watchdog has stopped:
          # wait for both the old HTTP listener and its actual process.
          for attempt in $(seq 1 100); do
            if ! curl -fsS --max-time 1 http://127.0.0.1:18191/ping >/dev/null 2>&1; then
              echo "BUCKET_PREVIOUS_SERVER_CLOSED phase=$phase attempt=$attempt"
              break
            fi
            sleep 1
          done
          if curl -fsS --max-time 1 http://127.0.0.1:18191/ping >/dev/null 2>&1; then
            echo 'Old ClickHouse still listening; refuse unsafe restart' >&2
            exit 1
          fi
          sleep 2
          "$binary" server --config-file="$RUNNER_TEMP/config.xml" >"evidence/ch-server-$phase.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/ch.pid"
          for attempt in $(seq 1 120); do
            if curl -fsS --max-time 1 http://127.0.0.1:18191/ping >/dev/null 2>&1; then
              echo "BUCKET_SERVER_STARTED phase=$phase attempt=$attempt"
              exit 0
            fi
            sleep 1
          done
          tail -110 "evidence/ch-server-$phase.log"
          exit 1
          SH
          chmod +x "$RUNNER_TEMP/ch-restart.sh"

      - name: Same-run A/B/A - original native vs guarded selector scalar AVG vs original
        run: |
          set -euo pipefail
          for phase in base_before selector_scalar base_after; do
            case "$phase" in
              base_before) ;;
              selector_scalar) "$RUNNER_TEMP/ch-restart.sh" "$RUNNER_TEMP/selectorscalar-bin/clickhouse" selector_scalar ;;
              base_after) "$RUNNER_TEMP/ch-restart.sh" "$RUNNER_TEMP/ch-bin/clickhouse" base_after ;;
            esac
            echo "SELECTOR_SCALAR_PHASE_BEGIN=$phase"
            python3 .github/ts-lab-bench/bench_selector_scalar_cpp_aba.py \
              --phase "$phase" --jenkins-manifest evidence/manifest.json \
              --dense-manifest evidence/dense-manifest.json \
              --canonical evidence/selector-scalar-canonical.json \
              --warmups 1 --repeats 4 \
              --output "evidence/selector-scalar-$phase.json" \
              | tee "evidence/selector-scalar-$phase.log"
            python3 .github/ts-lab-bench/bench_selector_scalar_mixed_metric_aba.py \
              --phase "$phase" --jenkins-manifest evidence/manifest.json \
              --canonical evidence/mixed-metric-canonical.json \
              --warmups 1 --repeats 5 \
              --output "evidence/mixed-metric-$phase.json" \
              | tee "evidence/mixed-metric-$phase.log"
          done
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('evidence')
          phases=['base_before','selector_scalar','base_after']
          items={p:json.loads((root/('selector-scalar-'+p+'.json')).read_text()) for p in phases}
          result=[]
          for case in items['base_before']['cases']:
              row={'case':case,'output_points':items['base_before']['cases'][case]['points']}
              for phase in phases:
                  x=items[phase]['cases'][case]
                  assert x['result_equals_reference'],(case,phase,'wrong result')
                  assert x['points']==row['output_points'],(case,phase,'point count')
                  row[phase]={k:x[k] for k in [
                      'p50_ms','p95_ms','p99_ms','read_rows_p50','read_bytes_p50',
                      'tracked_memory_p95_bytes','tracked_memory_peak_bytes']}
              row['selector_scalar_speedup_vs_recheck']=round(row['base_after']['p50_ms']/row['selector_scalar']['p50_ms'],4)
              row['selector_scalar_memory_ratio_vs_recheck']=round(
                  row['selector_scalar']['tracked_memory_p95_bytes']/
                  max(1,row['base_after']['tracked_memory_p95_bytes']),4)
              print('SELECTOR_SCALAR_ABA_CASE',json.dumps(row,separators=(',',':')),flush=True)
              result.append(row)
          summary={'cases':result,'all_CH_results_equal':True,'jenkins_series':282036,
                   'dense_series':20000,'dense_samples':2400000,
                   'scope':'C++ scalar grouped AVG v2: lazy AST/metadata guard, 32768 samples row threshold; unrelated rate and filters native'}
          (root/'selector-scalar-aba-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print('SELECTOR_SCALAR_ABA_DONE',json.dumps({'cases':len(result),'all_exact':True}),flush=True)
          small={p:json.loads((root/('mixed-metric-'+p+'.json')).read_text()) for p in phases}
          assert len({small[p]['points'] for p in phases})==1
          assert all(small[p]['all_exact'] for p in phases)
          print('MIXED_METRIC_FALSE_POSITIVE',json.dumps({
              'small_series':small['selector_scalar']['selected_metric_series'],
              'time_series_total_rows':small['selector_scalar']['total_time_series_rows'],
              'native_before_ms':small['base_before']['p50_ms'],
              'candidate_ms':small['selector_scalar']['p50_ms'],
              'native_after_ms':small['base_after']['p50_ms'],
              'candidate_vs_recheck_speedup':
                round(small['base_after']['p50_ms']/small['selector_scalar']['p50_ms'],4),
              'all_exact':True,
          }),flush=True)
          PY

      - name: Measure on-disk data and run capped VictoriaMetrics unique-series diagnostic
        if: success()
        run: |
          set -euo pipefail
          curl -fsS --data-binary \
            "SELECT table, sum(bytes_on_disk) AS bytes, sum(rows) AS rows FROM system.parts WHERE database='default' AND active GROUP BY table ORDER BY table FORMAT TSV" \
            http://127.0.0.1:18191/ | tee evidence/ch-active-parts.tsv
          du -sb "$RUNNER_TEMP/ch/data" "$RUNNER_TEMP/vm/data" 2>evidence/du-errors.txt \
            | tee evidence/raw-storage-bytes.tsv || true
          ps -eo pid,ppid,rss,comm | grep -E 'clickhouse|victoria-metrics|PID' \
            | tee evidence/process-memory.tsv || true
          if [ "$LIMIT_PROBE" = 1 ]; then
            kill "$(cat "$RUNNER_TEMP/vm.pid")"
            for i in $(seq 1 100); do
              if ! kill -0 "$(cat "$RUNNER_TEMP/vm.pid")" 2>/dev/null; then break; fi
              sleep 1
            done
            "$RUNNER_TEMP/vm-bin/victoria-metrics-prod" -storageDataPath="$RUNNER_TEMP/vm/data" \
              -retentionPeriod=4w -httpListenAddr=127.0.0.1:8430 -search.disableCache \
              -search.maxUniqueTimeseries=165000 >evidence/vm-capped-server.log 2>&1 &
            echo "$!" > "$RUNNER_TEMP/vm-capped.pid"
            for i in $(seq 1 90); do
              if curl -fsS --max-time 2 http://127.0.0.1:8430/health >/dev/null 2>&1; then break; fi
              sleep 2
            done
            python3 - <<'PY'
          import json,urllib.parse,urllib.request,urllib.error
          m=json.load(open('evidence/manifest.json'))
          expr='avg by(stage)(avg_over_time(jenkins_avs_build_stage_duration[1d]))'
          url='http://127.0.0.1:8430/api/v1/query_range?'+urllib.parse.urlencode({
              'query':expr,'start':m['query_start_epoch'],'end':m['query_end_epoch'],'step':86400,'nocache':1})
          try:
              with urllib.request.urlopen(url,timeout=300) as r:
                  code=r.status;payload=r.read().decode('utf-8','replace')
          except urllib.error.HTTPError as e:
              code=e.code;payload=e.read().decode('utf-8','replace')
          record={'limit':165000,'series':m['total_series'],'status':code,'response_excerpt':payload[:2200]}
          print('JENKINS_VM_165K_GATE',json.dumps(record,sort_keys=True))
          with open('evidence/vm-limit-165k.json','w') as f:json.dump(record,f,indent=2)
          PY
          fi

      - name: Preserve raw evidence and any errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tslab-selector-scalar-grouped-avg-aba-jenkins-dense-${{ github.run_id }}
