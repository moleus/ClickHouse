name: R19 50k TAGS native ABBA with expired TimeRanges only removed
on:
  push:
    branches: [lab/ts-cbo-adaptive-20261103]
    paths: ['.github/workflows/ts-lab-r19-timeranges-native-abba-20261103.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ts-lab-r19-ranges-native-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  r02:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: moleus/ClickHouse
      BINARY_SHA256: f0a2fa1f814c58853f43423705cac10ab9df3bfe5887e27ebe9620ba7cb9660e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Source and preflight
        run: |
          set -euo pipefail
          mkdir -p evidence/r19rangeperf
          test "$(readlink AGENTS.md)" = .claude/CLAUDE.md
          test "$(git ls-files -s AGENTS.md | cut -d' ' -f1)" = 120000
          python3 -m py_compile .github/ts-lab/experiments/r02_small_batch_write_merge.py .github/ts-lab/experiments/r19_expired_metadata_native.py .github/ts-lab/experiments/r19_timeranges_prune_native_abba.py
          python3 .github/ts-lab/experiments/r19_timeranges_prune_native_abba.py --help > evidence/r19rangeperf/help.txt
          git rev-parse HEAD > evidence/r19rangeperf/workflow-head.txt
          sha256sum .github/ts-lab/experiments/r02_small_batch_write_merge.py .github/ts-lab/experiments/r19_expired_metadata_native.py .github/ts-lab/experiments/r19_timeranges_prune_native_abba.py > evidence/r19rangeperf/script-sha256.txt
      - name: Reuse pinned SHA verified O1 binary (no recompilation)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r19rangeperf-art" "$RUNNER_TEMP/r19rangeperf-bin"
          gh run download 41596421285 -R "$REPO" \
            --pattern 'tslab-stock-clickhouse-o1-binary-*' \
            -D "$RUNNER_TEMP/r19rangeperf-art"
          archive="$(find "$RUNNER_TEMP/r19rangeperf-art" -name 'clickhouse-stock-clickhouse-o1-linux-amd64.tar.zst' -type f -print -quit)"
          test -s "$archive"
          (cd "$(dirname "$archive")" && sha256sum -c ARCHIVE_SHA256SUMS) | tee evidence/r19rangeperf/archive-verify.txt
          zstd -dc "$archive" | tar -xf - -C "$RUNNER_TEMP/r19rangeperf-bin"
          (cd "$RUNNER_TEMP/r19rangeperf-bin" && sha256sum -c SHA256SUMS) | tee evidence/r19rangeperf/binary-verify.txt
          test "$(sha256sum "$RUNNER_TEMP/r19rangeperf-bin/clickhouse" | cut -d' ' -f1)" = "$BINARY_SHA256"
          grep -q 'source=52529f0c711566d696917678bf15e7068772fdde' "$RUNNER_TEMP/r19rangeperf-bin/BUILD_INFO.txt"
          grep -q 'optimization=O1 unmodified stock source no lab patches' "$RUNNER_TEMP/r19rangeperf-bin/BUILD_INFO.txt"
          cp "$RUNNER_TEMP/r19rangeperf-bin/BUILD_INFO.txt" evidence/r19rangeperf/build-info.txt
          chmod +x "$RUNNER_TEMP/r19rangeperf-bin/clickhouse"
          "$RUNNER_TEMP/r19rangeperf-bin/clickhouse" --version | tee evidence/r19rangeperf/version.txt
      - name: Start isolated ClickHouse with query_log and bounded memory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r19rangeperf"/{data,tmp,userfiles}
          cat > "$RUNNER_TEMP/r19rangeperf/config.xml" <<EOF
          <clickhouse>
            <logger><level>warning</level><console>true</console></logger>
            <listen_host>127.0.0.1</listen_host><http_port>18191</http_port><tcp_port>19000</tcp_port>
            <path>$RUNNER_TEMP/r19rangeperf/data/</path><tmp_path>$RUNNER_TEMP/r19rangeperf/tmp/</tmp_path>
            <user_files_path>$RUNNER_TEMP/r19rangeperf/userfiles/</user_files_path>
            <max_server_memory_usage>2800000000</max_server_memory_usage>
            <users><default><password></password><networks><ip>127.0.0.1</ip></networks><profile>default</profile><quota>default</quota></default></users>
            <profiles><default><allow_experimental_time_series_table>1</allow_experimental_time_series_table><enable_time_series_aggregate_functions>1</enable_time_series_aggregate_functions><max_threads>2</max_threads><max_memory_usage>1800000000</max_memory_usage><log_queries>1</log_queries></default></profiles>
            <quotas><default><interval><duration>3600</duration></interval></default></quotas>
            <query_log><database>system</database><table>query_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></query_log>
            <part_log><database>system</database><table>part_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></part_log>
            <default_profile>default</default_profile><default_database>default</default_database>
          </clickhouse>
          EOF
          "$RUNNER_TEMP/r19rangeperf-bin/clickhouse" server --config-file="$RUNNER_TEMP/r19rangeperf/config.xml" > evidence/r19rangeperf/server.log 2>&1 &
          echo "$!" > evidence/r19rangeperf/server.pid
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS --max-time 1 http://127.0.0.1:18191/ping > evidence/r19rangeperf/ping.txt 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then tail -100 evidence/r19rangeperf/server.log; exit 1; fi
      - name: Native 104-query A B B A full/TimeRanges-pruned read CPU with same 50k TAGS and 2k SAMPLES
        run: |
          set -euo pipefail
          python3 .github/ts-lab/experiments/r19_timeranges_prune_native_abba.py \
            --endpoint http://127.0.0.1:18191/ \
            --out evidence/r19rangeperf/report.json | tee evidence/r19rangeperf/console.log
          python3 - <<'PY'
          import json
          d=json.load(open('evidence/r19rangeperf/report.json'))
          assert d['passed'] and not d['errors'],d['errors']
          assert d['source_sha']=='52529f0c711566d696917678bf15e7068772fdde'
          assert d['fixture']['retired']==48000 and d['fixture']['live']==2000
          assert len(d['trials'])==104 and len(d['comparisons'])==2
          assert d['scientific_decision'] in ('ACCEPT_FOR_NEXT_GATE','NO_ROBUST_BROAD_IMPROVEMENT')
          f=d['physical']['tslab_r19_tr_full']
          c=d['physical']['tslab_r19_tr_pruned']
          assert f['tags']['rows']==50000 and c['tags']['rows']==50000
          assert f['samples']['rows']==2000 and c['samples']['rows']==2000
          assert f['timeranges']['rows']==50000 and c['timeranges']['rows']==2000
          assert d['resurrection']['sample_rows']==2001
          assert d['resurrection']['tags_rows']==50000
          assert d['resurrection']['timeranges_rows']==2001
          for kind in ('broad','project_p0'):
              assert len(d['phases'][kind])==4
              for field in ('wall_p50_ms','query_cpu_p50_ms'):
                  assert d['comparisons'][kind][field]['full_AA_drift']<=.25
          print('R19_RANGE_COST_VALIDATED',json.dumps({'passed':True,
              'decision':d['scientific_decision'],
              'comparisons':d['comparisons'],
              'resurrection':d['resurrection']},separators=(',',':')))

          PY
      - name: Preserve raw correct and failed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tslab-r19-ranges-native-abba-${{ github.run_id }}
          path: |
            evidence/r19rangeperf/*.txt
            evidence/r19rangeperf/*.log
            evidence/r19rangeperf/*.json
            evidence/r19rangeperf/phase-*/report.json
            evidence/r19rangeperf/phase-*/config.xml
            evidence/r19rangeperf/phase-*/server.log
          if-no-files-found: error
          retention-days: 45
          compression-level: 1
