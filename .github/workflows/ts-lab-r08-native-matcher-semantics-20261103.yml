name: TimeSeries R08 native PromQL matcher semantic oracle
on:
  push:
    branches: [lab/ts-cbo-adaptive-20261103]
    paths: ['.github/workflows/ts-lab-r08-native-matcher-semantics-20261103.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ts-lab-r08-native-matcher-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  r08:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: moleus/ClickHouse
      BINARY_SHA256: 3990e373b43396d0faafd8feffe5dd6514bd57c520ec12e89b8e5796d64e6221
      FIXTURE_SHA256: 6ece3bbbaf5b861ba9df907b378891af31eff66f8964e8161eda8680e4fe496e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Source and preflight
        run: |
          set -euo pipefail
          mkdir -p evidence/r08
          test "$(readlink AGENTS.md)" = .claude/CLAUDE.md
          test "$(git ls-files -s AGENTS.md | cut -d' ' -f1)" = 120000
          python3 -m py_compile .github/ts-lab/experiments/r08_matcher_semantics.py
          python3 .github/ts-lab/experiments/r08_matcher_semantics.py --help > evidence/r08/help.txt
          git rev-parse HEAD > evidence/r08/workflow-head.txt
          sha256sum .github/ts-lab/experiments/r08_matcher_semantics.py > evidence/r08/script-sha256.txt
      - name: Reuse pinned SHA verified O1 binary (no recompilation)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r08-art" "$RUNNER_TEMP/r08-bin"
          gh run download 41531656434 -R "$REPO" \
            -n tslab-cbo-join-override-binary-f5e42456d7c09c56eb19e96e9ad6844623bc894e \
            -D "$RUNNER_TEMP/r08-art"
          archive="$(find "$RUNNER_TEMP/r08-art" -name 'clickhouse-cbo-join-override-linux-amd64.tar.zst' -type f -print -quit)"
          test -s "$archive"
          (cd "$(dirname "$archive")" && sha256sum -c ARCHIVE_SHA256SUMS) | tee evidence/r08/archive-verify.txt
          zstd -dc "$archive" | tar -xf - -C "$RUNNER_TEMP/r08-bin"
          (cd "$RUNNER_TEMP/r08-bin" && sha256sum -c SHA256SUMS) | tee evidence/r08/binary-verify.txt
          test "$(sha256sum "$RUNNER_TEMP/r08-bin/clickhouse" | cut -d' ' -f1)" = "$BINARY_SHA256"
          grep -q 'source=52529f0c711566d696917678bf15e7068772fdde' "$RUNNER_TEMP/r08-bin/BUILD_INFO.txt"
          cp "$RUNNER_TEMP/r08-bin/BUILD_INFO.txt" evidence/r08/build-info.txt
          chmod +x "$RUNNER_TEMP/r08-bin/clickhouse"
          "$RUNNER_TEMP/r08-bin/clickhouse" --version | tee evidence/r08/version.txt
      - name: Start isolated native ClickHouse
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r08"/{data,tmp,userfiles}
          cat > "$RUNNER_TEMP/r08/config.xml" <<EOF
          <clickhouse>
            <logger><level>warning</level><console>true</console></logger>
            <listen_host>127.0.0.1</listen_host><http_port>18191</http_port><tcp_port>19000</tcp_port>
            <path>$RUNNER_TEMP/r08/data/</path><tmp_path>$RUNNER_TEMP/r08/tmp/</tmp_path>
            <user_files_path>$RUNNER_TEMP/r08/userfiles/</user_files_path>
            <max_server_memory_usage>1500000000</max_server_memory_usage>
            <users><default><password></password><networks><ip>127.0.0.1</ip></networks><profile>default</profile><quota>default</quota></default></users>
            <profiles><default><allow_experimental_time_series_table>1</allow_experimental_time_series_table><enable_time_series_aggregate_functions>1</enable_time_series_aggregate_functions><max_threads>2</max_threads><max_memory_usage>750000000</max_memory_usage><log_queries>1</log_queries></default></profiles>
            <quotas><default><interval><duration>3600</duration></interval></default></quotas>
            <default_profile>default</default_profile><default_database>default</default_database>
          </clickhouse>
          EOF
          "$RUNNER_TEMP/r08-bin/clickhouse" server --config-file="$RUNNER_TEMP/r08/config.xml" > evidence/r08/server.log 2>&1 &
          echo "$!" > evidence/r08/server.pid
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS --max-time 1 http://127.0.0.1:18191/ping > evidence/r08/ping.txt 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then tail -100 evidence/r08/server.log; exit 1; fi
      - name: Exact native PromQL oracle before and after real part merges
        run: |
          set -euo pipefail
          python3 .github/ts-lab/experiments/r08_matcher_semantics.py \
            --endpoint http://127.0.0.1:18191/ \
            --table tslab_r08_matchers \
            --output evidence/r08/report.json | tee evidence/r08/console.log
          python3 - <<'PY'
          import json,os
          d=json.load(open("evidence/r08/report.json"))
          assert d['passed'] and len(d['cases'])==42 and not d['errors'],d.get('errors')
          assert d['input_sha256']==os.environ['FIXTURE_SHA256']
          assert all(d['parts_before'][x]['parts']==2 and d['parts_after'][x]['parts']==1
                     for x in ('samples','tags','timeranges'))
          print('R08_FINAL_CHECK',json.dumps({'passed':True,'cases':len(d['cases']),
                'fixture_sha':d['input_sha256'],'before':d['parts_before'],'after':d['parts_after']}))
          PY
      - name: Preserve raw correct and failed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tslab-r08-matcher-semantics-${{ github.run_id }}
          path: evidence/r08/
          if-no-files-found: error
          retention-days: 45
          compression-level: 1
