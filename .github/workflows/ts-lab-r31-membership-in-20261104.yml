name: R31 TimeRanges native generated SQL ALL ANY IN semijoin
on:
  push:
    branches: [lab/ts-cbo-adaptive-20261103]
    paths: ['.github/workflows/ts-lab-r31-membership-in-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tslab-r31-in-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  curve:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: moleus/ClickHouse
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Fail closed on source symlink or test errors
        run: |
          set -euo pipefail
          test "$(readlink AGENTS.md)" = ".claude/CLAUDE.md"
          test "$(git ls-files -s AGENTS.md | awk '{print $1}')" = 120000
          python3 -m py_compile .github/ts-lab-r31/*.py .github/ts-lab-r30/*.py .github/ts-lab-r06/probe_nested_selector_plan.py
          python3 -m unittest discover -s .github/ts-lab-r30 -p 'test_*.py' -v
          python3 -m unittest discover -s .github/ts-lab-r31 -p 'test_*.py' -v
          mkdir -p evidence
      - name: Reuse immutable O1 JOIN override binary, no compilation
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r31-in-art" "$RUNNER_TEMP/r31-in-bin"
          gh run download 41531656434 -R "$REPO" --pattern 'tslab-cbo-join-override-binary-*' -D "$RUNNER_TEMP/r31-in-art"
          archive="$(find "$RUNNER_TEMP/r31-in-art" -name 'clickhouse-cbo-join-override-linux-amd64.tar.zst' -type f -print -quit)"
          test -s "$archive"
          (cd "$(dirname "$archive")" && sha256sum -c ARCHIVE_SHA256SUMS) | tee evidence/archive-hash.txt
          zstd -dc "$archive" | tar -xf - -C "$RUNNER_TEMP/r31-in-bin"
          (cd "$RUNNER_TEMP/r31-in-bin" && sha256sum -c SHA256SUMS) | tee evidence/binary-hash.txt
          grep -q 'source=52529f0c711566d696917678bf15e7068772fdde' "$RUNNER_TEMP/r31-in-bin/BUILD_INFO.txt"
          grep -q 'optimization=O1' "$RUNNER_TEMP/r31-in-bin/BUILD_INFO.txt"
          echo "3990e373b43396d0faafd8feffe5dd6514bd57c520ec12e89b8e5796d64e6221  $RUNNER_TEMP/r31-in-bin/clickhouse" | sha256sum -c
          cp "$RUNNER_TEMP/r31-in-bin/BUILD_INFO.txt" evidence/build-info.txt
          chmod +x "$RUNNER_TEMP/r31-in-bin/clickhouse"
          "$RUNNER_TEMP/r31-in-bin/clickhouse" --version | tee evidence/version.txt
          sha256sum "$RUNNER_TEMP/r31-in-bin/clickhouse" | tee evidence/binary.sha256
      - name: Launch isolated DEBUG TimeSeries server
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r31in/data" "$RUNNER_TEMP/r31in/tmp" "$RUNNER_TEMP/r31in/userfiles"
          cat > "$RUNNER_TEMP/r31in-config.xml" <<EOF
          <clickhouse>
            <logger><level>debug</level><console>true</console></logger>
            <listen_host>127.0.0.1</listen_host>
            <http_port>18191</http_port><tcp_port>19000</tcp_port>
            <path>$RUNNER_TEMP/r31in/data/</path>
            <tmp_path>$RUNNER_TEMP/r31in/tmp/</tmp_path>
            <user_files_path>$RUNNER_TEMP/r31in/userfiles/</user_files_path>
            <max_server_memory_usage>3800000000</max_server_memory_usage>
            <users><default><password></password><networks><ip>127.0.0.1</ip></networks><profile>default</profile><quota>default</quota></default></users>
            <profiles><default>
              <allow_experimental_time_series_table>1</allow_experimental_time_series_table>
              <enable_time_series_aggregate_functions>1</enable_time_series_aggregate_functions>
              <log_queries>1</log_queries>
              <log_processors_profiles>1</log_processors_profiles>
              <max_memory_usage>2000000000</max_memory_usage>
              <max_threads>4</max_threads>
            </default></profiles>
            <quotas><default><interval><duration>3600</duration></interval></default></quotas>
            <query_log><database>system</database><table>query_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></query_log>
            <processors_profile_log><database>system</database><table>processors_profile_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></processors_profile_log>
            <default_profile>default</default_profile><default_database>default</default_database>
          </clickhouse>
          EOF
          "$RUNNER_TEMP/r31-in-bin/clickhouse" server --config-file="$RUNNER_TEMP/r31in-config.xml" >evidence/server.log 2>&1 &
          echo "$!" >evidence/server.pid
          for trial in $(seq 1 90); do
            if curl -fsS --max-time 1 http://127.0.0.1:18191/ping >/dev/null 2>&1; then
              echo "R31_IN_SERVER_READY"
              exit 0
            fi
            sleep 1
          done
          tail -110 evidence/server.log
          exit 1
      - name: Verify three-way SQL parity on 1x and 16x frozen TimeRanges, then A/B/C/C/B/A
        run: |
          set -euo pipefail
          python3 .github/ts-lab-r31/bench_membership_in.py \
            --out evidence/semijoin --log evidence/server.log --series 2048 \
            | tee evidence/semijoin.log
      - name: Report scientific R31 status even if query execution fails
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,json
          f=pathlib.Path('evidence/semijoin/report.json')
          if f.exists():
              r=json.loads(f.read_text())
              print('R31_STATUS',r.get('status'),'errors',r.get('errors'))
              for level,v in r.get('results',{}).items():
                  x=v.get('benchmark',{}).get('summary',{})
                  print('R31_LEVEL',level,'physical',v.get('physical',{}).get('rows'),
                        'wall',{k:z.get('wall_ms') for k,z in x.items()},
                        'cpu',{k:z.get('cpu_ms') for k,z in x.items()},
                        'mem',{k:z.get('query_memory_bytes') for k,z in x.items()})
          else:print('R31_REPORT_MISSING')
          PY
      - name: Preserve raw SQL, parts, profiles, results and invalid outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tslab-r31-inset-evidence
          path: evidence/
          retention-days: 45
          compression-level: 1
