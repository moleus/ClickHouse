name: TimeSeries project14d fresh 8 clients max_threads 1 memory envelope

on:
  push:
    branches: [lab/ts-cbo-adaptive-20261103]
    paths: ['.github/workflows/ts-lab-native-project-fresh8-thread1-20261103.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tslab-native-project-fresh8-thread1-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: moleus/ClickHouse
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate checkout and fail-fast benchmark imports
        run: |
          set -euo pipefail
          test "$(readlink AGENTS.md)" = .claude/CLAUDE.md
          test "$(git ls-files -s AGENTS.md | awk '{print $1}')" = 120000
          python3 -m py_compile \
            .github/ts-lab-cpu/bench_native_multiclient_stock_20261103.py \
            .github/ts-lab-cpu/bench_native_project_fresh8_20261103.py \
            .github/ts-lab-cpu/bench_native_project_fresh8_thread1_20261103.py \
            .github/ts-lab-cpu/bench_cpu_knobs.py \
            .github/ts-lab-layout/bench_metadata_paths.py \
            .github/ts-lab-layout/bench_layout_full.py \
            .github/ts-lab-perf/bench_granularity_v11.py
          python3 .github/ts-lab-layout/bench_metadata_paths.py --help >/dev/null
          python3 .github/ts-lab-cpu/bench_native_multiclient_stock_20261103.py --help >/dev/null
          python3 .github/ts-lab-cpu/bench_native_project_fresh8_20261103.py --help >/dev/null
          python3 .github/ts-lab-cpu/bench_native_project_fresh8_thread1_20261103.py --help >/dev/null
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/workflow-commit.txt
          uname -a | tee evidence/runner-kernel.txt
          nproc | tee evidence/runner-logical-cpus.txt
          grep -m1 '^model name' /proc/cpuinfo | tee evidence/runner-cpu.txt
          free -b | tee evidence/runner-memory.txt

      - name: Restore immutable pinned stock O1 binary and verify archive and executable
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ch-art" "$RUNNER_TEMP/ch-bin"
          gh run download 41596421285 -R "$REPO" \
            --pattern 'tslab-stock-clickhouse-o1-binary-*' \
            -D "$RUNNER_TEMP/ch-art"
          archive="$(find "$RUNNER_TEMP/ch-art" -name 'clickhouse-stock-clickhouse-o1-linux-amd64.tar.zst' -type f -print -quit)"
          test -s "$archive"
          (cd "$(dirname "$archive")" && sha256sum -c ARCHIVE_SHA256SUMS) | tee evidence/ch-stock-archive-hash.txt
          zstd -dc "$archive" | tar -xf - -C "$RUNNER_TEMP/ch-bin"
          (cd "$RUNNER_TEMP/ch-bin" && sha256sum -c SHA256SUMS) | tee evidence/ch-stock-binary-hash.txt
          test "$(grep '^source=' "$RUNNER_TEMP/ch-bin/BUILD_INFO.txt")" = \
            "source=52529f0c711566d696917678bf15e7068772fdde"
          grep -q 'optimization=O1 unmodified stock source no lab patches' "$RUNNER_TEMP/ch-bin/BUILD_INFO.txt"
          cp "$RUNNER_TEMP/ch-bin/BUILD_INFO.txt" evidence/BUILD_INFO.txt
          "$RUNNER_TEMP/ch-bin/clickhouse" --version | tee evidence/clickhouse-version.txt
          sha256sum "$RUNNER_TEMP/ch-bin/clickhouse" | tee evidence/clickhouse-binary-sha256.txt

      - name: Start isolated stock ClickHouse with native tracing and bounded memory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ch/data" "$RUNNER_TEMP/ch/tmp" "$RUNNER_TEMP/ch/userfiles"
          cat > "$RUNNER_TEMP/config.xml" <<EOF
          <clickhouse>
            <logger><level>warning</level><console>true</console></logger>
            <listen_host>127.0.0.1</listen_host>
            <http_port>18191</http_port><tcp_port>19000</tcp_port>
            <path>$RUNNER_TEMP/ch/data/</path><tmp_path>$RUNNER_TEMP/ch/tmp/</tmp_path>
            <user_files_path>$RUNNER_TEMP/ch/userfiles/</user_files_path>
            <max_server_memory_usage>4800000000</max_server_memory_usage>
            <users>
              <default><password></password>
              <networks><ip>127.0.0.1</ip></networks>
              <profile>default</profile><quota>default</quota></default>
            </users>
            <profiles><default>
              <allow_experimental_time_series_table>1</allow_experimental_time_series_table>
              <enable_time_series_aggregate_functions>1</enable_time_series_aggregate_functions>
              <log_queries>1</log_queries>
              <log_processors_profiles>1</log_processors_profiles>
              <log_query_threads>1</log_query_threads>
              <use_statistics>1</use_statistics>
              <query_profiler_cpu_time_period_ns>1000000</query_profiler_cpu_time_period_ns>
              <max_memory_usage>1800000000</max_memory_usage>
            </default></profiles>
            <quotas><default><interval><duration>3600</duration></interval></default></quotas>
            <query_log><database>system</database><table>query_log</table>
              <flush_interval_milliseconds>1000</flush_interval_milliseconds></query_log>
            <query_thread_log><database>system</database><table>query_thread_log</table>
              <flush_interval_milliseconds>1000</flush_interval_milliseconds></query_thread_log>
            <trace_log><database>system</database><table>trace_log</table>
              <flush_interval_milliseconds>1000</flush_interval_milliseconds></trace_log>
            <processors_profile_log><database>system</database><table>processors_profile_log</table>
              <flush_interval_milliseconds>1000</flush_interval_milliseconds></processors_profile_log>
            <default_profile>default</default_profile>
            <default_database>default</default_database>
          </clickhouse>
          EOF
          "$RUNNER_TEMP/ch-bin/clickhouse" server --config-file="$RUNNER_TEMP/config.xml" \
            >evidence/ch-server.log 2>&1 &
          echo "$!" > "$RUNNER_TEMP/ch.pid"
          for i in $(seq 1 100); do
            if curl -fsS --max-time 1 http://127.0.0.1:18191/ping >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS --max-time 3 http://127.0.0.1:18191/ping
          curl -fsS -X POST --data-binary 'SELECT version()' \
            http://127.0.0.1:18191/ | tee evidence/server-version.txt

      - name: Generate and ingest the exact 1.33m high-churn LC control fixture
        run: |
          set -euo pipefail
          python3 .github/ts-lab-bench/generate_95k_daily_churn_ts.py \
            --manifest evidence/churn-manifest.json \
            --fixture "$RUNNER_TEMP/95k-churn.jsonl" | tee evidence/ingest-lc.log
          sha256sum "$RUNNER_TEMP/95k-churn.jsonl" | tee evidence/fixture-sha256.txt
          test "$(sha256sum "$RUNNER_TEMP/95k-churn.jsonl" | awk '{print $1}')" = \
            "8f3a36846f80d6be5a8604d142e934399f2687094766c57bf105e43977f52858"

      - name: Create RAW v11 ID schema and stabilize identical on-disk datasets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path[:0]=[".github/ts-lab-perf",".github/ts-lab-bench",".github/ts-lab-cpu"]
          from bench_granularity_v11 import streamed_insert,optimize_table,wait_no_merges
          from bench_native_multiclient_stock_20261103 import create_raw,RAW,LC,physical
          create_raw()
          from os import environ
          inserted=streamed_insert(RAW,environ["RUNNER_TEMP"]+"/95k-churn.jsonl")
          assert inserted["rows"]==1330000,inserted
          optimized={t:optimize_table(t) for t in (LC,RAW)}
          wait_no_merges()
          manifest={"ingested":inserted,"optimized":optimized,
                    "physical_before":{t:physical(t) for t in (LC,RAW)}}
          Path("evidence/frozen-physical-preflight.json").write_text(
              json.dumps(manifest,indent=2,default=str)+"\n")
          print("FRESH8_DATA_FROZEN",json.dumps({"rows":inserted["rows"],
              "parts":{t:{k:p["parts"]["part_count"]
                    for k,p in manifest["physical_before"][t].items()}
                    for t in (LC,RAW)}}),flush=True)
          PY

      - name: Install safe ClickHouse restart for fresh-process phases
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ch-restart-fresh8.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          binary="$1"
          phase="$2"
          previous="$(cat "$RUNNER_TEMP/ch.pid")"
          children="$(cat "/proc/$previous/task/$previous/children" 2>/dev/null || true)"
          for pid in $children "$previous"; do
            if [ -n "$pid" ]; then kill -TERM "$pid" 2>/dev/null || true; fi
          done
          for attempt in $(seq 1 120); do
            if ! curl -fsS --max-time 1 http://127.0.0.1:18191/ping >/dev/null 2>&1; then
              echo "FRESH8_PREVIOUS_SERVER_CLOSED phase=$phase"
              break
            fi
            sleep 1
          done
          if curl -fsS --max-time 1 http://127.0.0.1:18191/ping >/dev/null 2>&1; then
            echo "FRESH8_OLD_LISTENER_STILL_ALIVE refusing restart" >&2
            exit 1
          fi
          sleep 2
          "$binary" server --config-file="$RUNNER_TEMP/config.xml" >"evidence/ch-$phase.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/ch.pid"
          for attempt in $(seq 1 120); do
            if curl -fsS --max-time 1 http://127.0.0.1:18191/ping >/dev/null 2>&1; then
              echo "FRESH8_NEW_SERVER_READY phase=$phase"
              exit 0
            fi
            sleep 1
          done
          echo "FRESH8_RESTART_TIMEOUT phase=$phase" >&2
          tail -100 "evidence/ch-$phase.log" >&2
          exit 1
          SH
          chmod +x "$RUNNER_TEMP/ch-restart-fresh8.sh"

      - name: Measure project14d eight clients max_threads one with fresh process per ABBA phase
        run: |
          set -euo pipefail
          mkdir -p evidence/fresh-project8-t1
          python3 -u .github/ts-lab-cpu/bench_native_project_fresh8_thread1_20261103.py \
            --binary "$RUNNER_TEMP/ch-bin/clickhouse" \
            --restart-script "$RUNNER_TEMP/ch-restart-fresh8.sh" \
            --pid-file "$RUNNER_TEMP/ch.pid" \
            --fixture "$RUNNER_TEMP/95k-churn.jsonl" \
            --manifest evidence/churn-manifest.json \
            --output evidence/fresh-project8-t1/report.json \
            | tee evidence/fresh-project8-t1.log

      - name: Retain all successful and rejected phase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tslab-native-project-fresh8-thread1-${{ github.run_id }}
          path: evidence/
          retention-days: 45
          compression-level: 1
