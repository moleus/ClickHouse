name: R42 native 160-case output and plans against R41
on:
  push:
    branches: [lab/ts-cbo-adaptive-20261103]
    paths: ['.github/workflows/ts-lab-r42-native-guards-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tslab-r42-native-guards-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  native-guards:
    runs-on: ${{ vars.CH_BENCH_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      TS_LAB_ROOT: /tmp/tslab-r42-guard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile Python harness and prepare evidence
        run: |
          set -euo pipefail
          python3 -m py_compile .github/ts-lab-r42/guard_suite.py .github/ts-lab-r35/native.py
          mkdir -p "$TS_LAB_ROOT" evidence
      - name: Download R41 verified O2 baseline
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41799488038
          name: tslab-r41-late-root-tags-o2-binary-3e322d16ec68cc65cfd08edc29c49599d8093274
          path: ${{ runner.temp }}/r41-artifact
      - name: Download R42 direct serializer O2 candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41801868345
          name: tslab-r42-direct-root-tags-o2-binary-a0bd836ea4db9edfd2c8291115c88b1c15bc192d
          path: ${{ runner.temp }}/r42-artifact
      - name: Verify binary hashes and exact source provenance
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zstd
          for v in r41 r42; do
            mapfile -t archives < <(find "$RUNNER_TEMP/$v-artifact" -name "clickhouse-$v-*.tar.zst" -type f)
            test "${#archives[@]}" -eq 1
            mkdir -p "$RUNNER_TEMP/extract-$v"
            tar -I unzstd -xf "${archives[0]}" -C "$RUNNER_TEMP/extract-$v"
            (cd "$RUNNER_TEMP/extract-$v" && sha256sum -c SHA256SUMS)
            sha256sum "$RUNNER_TEMP/extract-$v/clickhouse" | tee "evidence/$v-sha256.txt"
            "$RUNNER_TEMP/extract-$v/clickhouse" --version | tee "evidence/$v-version.txt"
          done
          echo "1fbf8d81f3d4f730f87578e4fb4f16de593f6fee30370d0afd2fd7c67f8281a2  $RUNNER_TEMP/extract-r41/clickhouse" | sha256sum -c -
          echo "5563d0d37e12d8fbc8270923284804b6c9b5522a177618ade26534c7050b0cff  $RUNNER_TEMP/extract-r42/clickhouse" | sha256sum -c -
          mkdir -p "$TS_LAB_ROOT/r41-late-root-tags-o2/bin" "$TS_LAB_ROOT/r42-direct-root-tags-o2/bin"
          cp "$RUNNER_TEMP/extract-r41/clickhouse" "$TS_LAB_ROOT/r41-late-root-tags-o2/bin/clickhouse"
          cp "$RUNNER_TEMP/extract-r42/clickhouse" "$TS_LAB_ROOT/r42-direct-root-tags-o2/bin/clickhouse"
      - name: R41 native 160-case reference
        run: |
          set -euo pipefail
          python3 .github/ts-lab-r42/guard_suite.py r41 | tee evidence/r41-guard.log
          cp "$TS_LAB_ROOT/guard-r41.json" evidence/
      - name: R42 native output, errors and plan parity
        run: |
          set -euo pipefail
          python3 .github/ts-lab-r42/guard_suite.py r42 | tee evidence/r42-guard.log
          cp "$TS_LAB_ROOT/guard-r42.json" evidence/
      - name: Upload all native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tslab-r42-native-guard-${{ github.sha }}
          path: |
            evidence/
            ${{ env.TS_LAB_ROOT }}/guard-*.json
          compression-level: 4
          retention-days: 45
          if-no-files-found: warn
